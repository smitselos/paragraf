<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Αθλητισμός — Κριτήριο Αξιολόγησης</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5f0e8;--ink:#1a1610;--rust:#c4622d;--sage:#4a6741;
  --gold:#b8973a;--muted:#7a7060;--blue:#2b5fa0;--violet:#6b3fa0;
  --correct:#2d8e4e;--paper:#ede8dc;
  --shadow:4px 8px 28px rgba(26,22,16,.15);
  --shadow-lg:6px 14px 40px rgba(26,22,16,.22);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--cream);
  background-image:radial-gradient(ellipse at 15% 10%,rgba(184,151,58,.08) 0%,transparent 60%),
                   radial-gradient(ellipse at 85% 90%,rgba(43,95,160,.06) 0%,transparent 55%);
  font-family:'Source Sans 3',sans-serif;
  color:var(--ink);
  min-height:100vh;
}

/* ══ TOPBAR ══ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;border-bottom:1px solid rgba(26,22,16,.09);
  background:var(--cream);position:sticky;top:0;z-index:100;
}
.tb-left{display:flex;flex-direction:column;gap:2px;}
.tb-eyebrow{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.tb-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;}
.tb-title em{font-style:italic;color:var(--rust);}
.tb-right{display:flex;align-items:center;gap:10px;}
.progress-pill{
  background:rgba(26,22,16,.07);border-radius:20px;
  padding:5px 14px;font-size:12px;font-weight:700;color:var(--muted);
}
.progress-pill span{color:var(--ink);}

/* ══ SECTION TABS ══ */
.section-tabs{
  display:flex;gap:6px;padding:16px 28px 0;flex-wrap:wrap;
}
.stab{
  padding:8px 16px;border-radius:20px;
  border:1.5px solid rgba(26,22,16,.15);
  font-size:12px;font-weight:700;cursor:pointer;
  background:#fff;color:var(--muted);
  transition:all .2s;letter-spacing:.3px;
}
.stab:hover{border-color:var(--gold);color:var(--ink);}
.stab.active{color:#fff;border-color:transparent;}
.stab.sa{background:var(--rust);}
.stab.sb{background:var(--sage);}
.stab.sc{background:var(--blue);}
.stab.sd{background:var(--violet);}

/* ══ CARDS GRID ══ */
.cards-section{padding:20px 28px 40px;}
.section-header{
  display:flex;align-items:baseline;gap:10px;margin-bottom:18px;
  padding-bottom:10px;border-bottom:1px solid rgba(26,22,16,.08);
}
.sh-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.sh-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;}
.sh-mono{font-size:11px;color:var(--muted);}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}

/* ══ FLIP CARD ══ */
.flip-card{
  height:420px;cursor:pointer;perspective:1200px;
}
.flip-card.tall{height:520px;}
.flip-card.xtall{height:640px;}
.flip-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,0,.2,1);
}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}

.flip-front,.flip-back{
  position:absolute;inset:0;border-radius:14px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;
}

/* FRONT */
.flip-front{
  display:flex;flex-direction:column;
  box-shadow:var(--shadow);
}
.ff-top{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:32px 36px;position:relative;overflow:hidden;
}
.ff-top::after{
  content:'';position:absolute;bottom:-50px;right:-50px;
  width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.09);
}
.ff-sec{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:12px;}
.ff-q{
  font-family:'Playfair Display',serif;
  font-size:clamp(14px,1.6vw,18px);
  font-style:italic;color:#fff;line-height:1.65;
}
.ff-mono{
  font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:rgba(255,255,255,.35);font-weight:600;margin-top:14px;
}
.ff-bottom{
  background:#fff;padding:12px 36px;
  display:flex;align-items:center;justify-content:space-between;
}
.ff-tap{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.ff-tap svg{opacity:.5;}
.ff-pts{font-size:11px;font-weight:700;color:var(--gold);}

/* front colors per section */
.sec-a .ff-top{background:var(--rust);}
.sec-b1 .ff-top{background:var(--sage);}
.sec-b2 .ff-top{background:var(--blue);}
.sec-b3 .ff-top{background:#7a5c2a;}
.sec-c .ff-top{background:var(--violet);}
.sec-d .ff-top{background:#1a5c4a;}

/* BACK */
.flip-back{
  background:#fff;
  transform:rotateY(180deg);
  box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;
  overflow-y:auto;
}
.fb-header{
  padding:14px 22px 10px;
  border-bottom:1px solid rgba(26,22,16,.07);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.fb-hq{font-size:11px;font-weight:700;color:var(--muted);}
.fb-hpts{font-size:11px;font-weight:700;color:var(--gold);}
.fb-body{flex:1;padding:18px 22px;overflow-y:auto;}

/* ── SCHEMA ELEMENTS ── */
.schema-block{margin-bottom:14px;}
.schema-block:last-child{margin-bottom:0;}

/* Title row */
.sch-title{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  font-weight:700;color:var(--muted);margin-bottom:6px;
}

/* Answer text */
.sch-text{font-size:13.5px;line-height:1.65;color:var(--ink);}
.sch-text strong{color:var(--rust);}
.sch-text em{color:var(--sage);font-style:italic;}

/* Tag badge */
.sch-tag{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;margin-bottom:8px;
}
.tag-q{background:rgba(196,98,45,.1);color:var(--rust);}
.tag-a{background:rgba(74,103,65,.1);color:var(--sage);}
.tag-key{background:rgba(184,151,58,.12);color:#8a6b1a;}
.tag-blue{background:rgba(43,95,160,.1);color:var(--blue);}

/* Arrow list */
.sch-list{list-style:none;display:flex;flex-direction:column;gap:6px;}
.sch-list li{
  display:flex;gap:8px;align-items:flex-start;
  font-size:13px;line-height:1.55;
}
.sch-list li::before{
  content:'→';color:var(--gold);font-weight:700;flex-shrink:0;margin-top:1px;
}

/* Comparison table */
.sch-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
.sch-table th{
  background:rgba(26,22,16,.06);padding:7px 10px;
  font-weight:700;text-align:left;border-bottom:1.5px solid rgba(26,22,16,.1);
  font-size:10px;letter-spacing:1px;text-transform:uppercase;
}
.sch-table td{padding:8px 10px;border-bottom:1px solid rgba(26,22,16,.06);vertical-align:top;line-height:1.5;}
.sch-table tr:last-child td{border-bottom:none;}
.sch-table .td-k{font-weight:700;color:var(--rust);white-space:nowrap;}

/* Divider */
.sch-divider{height:1px;background:rgba(26,22,16,.07);margin:12px 0;}

/* Quote block */
.sch-quote{
  border-left:3px solid var(--gold);padding:8px 14px;
  background:rgba(184,151,58,.07);border-radius:0 6px 6px 0;
  font-size:12.5px;line-height:1.6;font-style:italic;color:var(--ink);
  margin:6px 0;
}
.sch-quote cite{display:block;margin-top:4px;font-size:11px;color:var(--muted);font-style:normal;font-weight:700;}

/* Box */
.sch-box{
  background:rgba(26,22,16,.04);border-radius:8px;
  padding:10px 14px;margin:6px 0;font-size:13px;line-height:1.6;
}
.sch-box.ok{background:rgba(45,142,78,.08);border-left:3px solid var(--correct);}
.sch-box.warn{background:rgba(184,151,58,.1);border-left:3px solid var(--gold);}

/* Back close hint */
.fb-footer{
  padding:8px 22px;border-top:1px solid rgba(26,22,16,.06);
  font-size:10px;color:var(--muted);text-align:center;flex-shrink:0;
}


/* ══ FULLSCREEN OVERLAY ══ */
#cardOverlay{
  display:none;
  position:fixed;inset:0;z-index:500;
  background:rgba(20,16,10,.55);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  align-items:center;justify-content:center;
  padding:20px;
  animation:overlayIn .25s ease;
}
#cardOverlay.visible{display:flex;}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}

#overlayPanel{
  background:#fff;
  border-radius:18px;
  box-shadow:0 24px 80px rgba(20,16,10,.35);
  width:100%;max-width:860px;
  max-height:92vh;
  display:flex;flex-direction:column;
  animation:panelIn .3s cubic-bezier(.22,1,.36,1);
  overflow:hidden;
}
@keyframes panelIn{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}

#overlayHeader{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px 14px;
  border-bottom:1px solid rgba(26,22,16,.07);
  flex-shrink:0;
}
#overlayLabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;}
#overlayPts{font-size:12px;font-weight:700;color:var(--gold);}
#overlayClose{
  background:rgba(26,22,16,.07);border:none;border-radius:50%;
  width:34px;height:34px;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);transition:background .15s;flex-shrink:0;
  line-height:1;
}
#overlayClose:hover{background:rgba(26,22,16,.14);}

#overlayBody{
  flex:1;overflow-y:auto;
  padding:28px 36px;
}
#overlayBody .sch-title{font-size:11px;letter-spacing:2px;margin-bottom:8px;}
#overlayBody .sch-text{font-size:15px;line-height:1.7;}
#overlayBody .sch-table{font-size:14px;}
#overlayBody .sch-table th{font-size:11px;padding:9px 12px;}
#overlayBody .sch-table td{padding:10px 12px;line-height:1.6;}
#overlayBody .sch-list li{font-size:14.5px;line-height:1.6;}
#overlayBody .sch-quote{font-size:14px;line-height:1.7;padding:10px 18px;}
#overlayBody .sch-quote cite{font-size:12px;}
#overlayBody .sch-box{font-size:14px;line-height:1.65;padding:12px 18px;}
#overlayBody .sch-divider{margin:16px 0;}
#overlayBody .schema-block{margin-bottom:18px;}

#overlayFooter{
  padding:10px 28px;border-top:1px solid rgba(26,22,16,.06);
  font-size:11px;color:var(--muted);text-align:center;flex-shrink:0;
}

/* ══ RESPONSIVE ══ */
@media(max-width:600px){
  .topbar{padding:12px 16px;}
  .section-tabs{padding:12px 16px 0;}
  .cards-section{padding:16px 12px 36px;}
  .cards-grid{grid-template-columns:1fr;}
  .flip-card{height:380px;}
  .flip-card.tall{height:460px;}
  .flip-card.xtall{height:560px;}
  .ff-top{padding:24px 22px;}
  .ff-bottom{padding:10px 22px;}
}
@media(min-width:1200px){
  .cards-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <div class="tb-eyebrow">Κριτήριο Αξιολόγησης</div>
    <div class="tb-title">Αθλητισμός — <em>Κείμενα & Θέματα</em></div>
  </div>
  <div class="tb-right">
    <div class="progress-pill"><span id="openCount">0</span> / <span id="totalCount">0</span> ανοιχτές</div>
  </div>
</div>

<div class="section-tabs">
  <div class="stab sa active" data-sec="all">Όλα</div>
  <div class="stab sa" data-sec="a">Θέμα Α</div>
  <div class="stab sb" data-sec="b">Θέμα Β</div>
  <div class="stab sc" data-sec="c">Θέμα Γ</div>
  <div class="stab sd" data-sec="d">Θέμα Δ</div>
</div>

<div class="cards-section" id="cardsContainer"></div>


<!-- FULLSCREEN OVERLAY -->
<div id="cardOverlay">
  <div id="overlayPanel">
    <div id="overlayHeader">
      <div id="overlayLabel"></div>
      <div id="overlayPts"></div>
      <button id="overlayClose" aria-label="Κλείσιμο">&#x2715;</button>
    </div>
    <div id="overlayBody"></div>
    <div id="overlayFooter">Πάτα ✕ ή έξω από την κάρτα για κλείσιμο</div>
  </div>
</div>

<script>
const CARDS = [
  // ══ ΘΕΜΑ Α ══
  {
    id:'a1', sec:'a', secLabel:'Θέμα Α · Α1', pts:'20 μον.',
    size:'tall',
    q:'Να παρουσιάσεις συνοπτικά, σε 70 περίπου λέξεις, τα οφέλη της γυμναστικής και της άθλησης, σύμφωνα με το Κείμενο 1.',
    color:'sec-a',
    ans:`
<div class="schema-block">
  <div class="sch-title">Δομή απάντησης</div>
  <div class="sch-box ok">Εισαγωγική περίοδος + ανάπτυξη ≈ 70 λέξεις · χωρίς αναφορά πηγής πάνω από 1 φορά</div>
</div>
<div class="schema-block">
  <div class="sch-title">Περιεχόμενο — 4 κατηγορίες οφελών</div>
  <ul class="sch-list">
    <li><strong>Σωματικά:</strong> εξασφάλιση υγείας, αρμονική σωματική ανάπτυξη</li>
    <li><strong>Ψυχοπνευματικά:</strong> θέληση, θάρρος, αυτοπεποίθηση, πειθαρχία, αρμονία</li>
    <li><strong>Κοινωνικά (ομαδικά αθλήματα):</strong> συνεργασία, ομαδικότητα, σεβασμός, υποταγή «εγώ» στο σύνολο</li>
    <li><strong>Αγωγή — χαλάρωση:</strong> χαλάρωση από το καθημερινό άγχος · απαραίτητο στοιχείο της σχολικής αγωγής (Rousseau)</li>
  </ul>
</div>
<div class="schema-block">
  <div class="sch-title">Υπόδειγμα</div>
  <div class="sch-quote">Σύμφωνα με το Κείμενο 1, η γυμναστική και η άθληση προσφέρουν πλούσια οφέλη. Σωματικά, εξασφαλίζουν υγεία και αρμονική ανάπτυξη του κορμιού. Ψυχοπνευματικά, καλλιεργούν θέληση, θάρρος, αυτοπεποίθηση και πειθαρχία. Τα ομαδικά αθλήματα ειδικά ενισχύουν τη συνεργασία, την ομαδικότητα και τον σεβασμό, αρετές ζωτικές για την κοινωνική συμβίωση. Τέλος, η γυμναστική χαλαρώνει τους μαθητές από το καθημερινό άγχος και αποτελεί απαραίτητο στοιχείο της σχολικής αγωγής. <cite>(70 λέξεις)</cite></div>
</div>`
  },

  // ══ ΘΕΜΑ Β ══
  {
    id:'b1', sec:'b', secLabel:'Θέμα Β · Β1', pts:'10 μον.',
    size:'xtall',
    q:'Να παρουσιάσεις δύο κοινές θέσεις / αναφορές στις οποίες συγκλίνουν οι συντάκτες των Κειμένων 1 και 2, καταγράφοντας και τα σχετικά χωρία.',
    color:'sec-b1',
    ans:`
<div class="schema-block">
  <div class="sch-title">Μεθοδολογία</div>
  <ul class="sch-list">
    <li>Εντοπισμός θεματικής σύγκλισης</li>
    <li>Διατύπωση κοινής θέσης με δικά μου λόγια</li>
    <li>Παράθεση χωρίου από κάθε κείμενο</li>
  </ul>
</div>
<div class="sch-divider"></div>
<div class="schema-block">
  <div class="sch-title">Σύγκλιση 1 — Ενότητα σώματος & πνεύματος</div>
  <div class="sch-box">Και οι δύο συντάκτες υποστηρίζουν ότι η άσκηση δεν ωφελεί μόνο το σώμα αλλά καλλιεργεί και πνευματικές / ηθικές αξίες.</div>
  <div class="sch-quote">«Από την ενότητα ψυχής και σώματος πηγάζει ένα υπέρτατο χρέος, η παράλληλη άσκηση του σώματος και του πνεύματος» <cite>— Κείμενο 1</cite></div>
  <div class="sch-quote">«Στα σπορτ δε γυμνάζεις το σώμα σου μονάχα· γυμνάζεις, πάνω απ&rsquo; όλα, την ψυχή σου» <cite>— Κείμενο 2</cite></div>
</div>
<div class="sch-divider"></div>
<div class="schema-block">
  <div class="sch-title">Σύγκλιση 2 — Αξία ομαδικών αθλημάτων για την κοινωνικότητα</div>
  <div class="sch-box">Αμφότεροι τονίζουν ότι τα ομαδικά αθλήματα διδάσκουν υποταγή του ατομικού στο συλλογικό.</div>
  <div class="sch-quote">«…την υποταγή του «εγώ» στη συνολική βούληση και στόχευση, αρετές απαραίτητες για την κοινωνική συμβίωση» <cite>— Κείμενο 1</cite></div>
  <div class="sch-quote">«Τα ομαδικά παιχνίδια υπηρετούν μεγάλο ηθικό σκοπό: σε συνηθίζουν να υποτάξεις την ατομικότητά σου σε μια γενική ενέργεια» <cite>— Κείμενο 2</cite></div>
</div>`
  },
  {
    id:'b2a', sec:'b', secLabel:'Θέμα Β · Β2α — Ύφος & Πρόθεση', pts:'10 μον.',
    size:'xtall',
    q:'Να αντιστοιχίσεις κάθε κείμενο με το ύφος (ΣΤΗΛΗ Β) και να αιτιολογήσεις: α) 2 γλωσσικές επιλογές με χωρίο, β) επακριβής πρόθεση κάθε συντάκτη.',
    color:'sec-b2',
    ans:`
<div class="schema-block">
  <div class="sch-title">Αντιστοίχιση</div>
  <table class="sch-table">
    <tr><th>Κείμενο</th><th>Ύφος</th><th>Πρόθεση</th></tr>
    <tr><td class="td-k">Κείμενο 1</td><td>επίσημο / απρόσωπο</td><td>Να πείσει τον αναγνώστη για την αξία της γυμναστικής και της άθλησης</td></tr>
    <tr><td class="td-k">Κείμενο 2</td><td>λογοτεχνικό / βιωματικό</td><td>Να μοιραστεί σκέψεις και προβληματισμούς για τον ρόλο των ομαδικών αθλημάτων στην αγωγή</td></tr>
  </table>
</div>
<div class="sch-divider"></div>
<div class="schema-block">
  <div class="sch-title">Γλωσσικές επιλογές — Κείμενο 1 (επίσημο)</div>
  <ul class="sch-list">
    <li><strong>Γ΄ πρόσωπο / αναφορική λειτουργία:</strong> «Η γυμναστική και η άθληση εξασφαλίζουν…» → αντικειμενικότητα, επιστημονικό ύφος</li>
    <li><strong>Ονοματικός λόγος / αφηρημένο λεξιλόγιο:</strong> «συναδέλφωση», «ψυχοπνευματική ζωή», «κοινωνική συμβίωση» → πυκνό, επίσημο ύφος</li>
  </ul>
</div>
<div class="sch-divider"></div>
<div class="schema-block">
  <div class="sch-title">Γλωσσικές επιλογές — Κείμενο 2 (λογοτεχνικό)</div>
  <ul class="sch-list">
    <li><strong>Α΄ / Β΄ πρόσωπο / ποιητική λειτουργία:</strong> «Νιώθεις πως εδώ…», «Περνώ ένα μικρό γιοφυράκι» → βιωματική αφήγηση, συναισθηματική εμπλοκή</li>
    <li><strong>Λαϊκό / δημοτικό λεξιλόγιο & εικόνες:</strong> «γιοφυράκι», «αγιάτρευτη νοσταλγία», «αψηλές κορυφές» → ποιητικό, εκφραστικό ύφος</li>
  </ul>
</div>`
  },
  {
    id:'b2b', sec:'b', secLabel:'Θέμα Β · Β2β — Δομή τελ. παρ. Κειμένου 2', pts:'5 μον.',
    size:'tall',
    q:'Να εξετάσεις αν η τελευταία παράγραφος του Κειμένου 2 έχει ολοκληρωμένη / τριμερή δομή. Να αιτιολογήσεις με αναφορά στο περιεχόμενο.',
    color:'sec-b2',
    ans:`

let openCards = new Set();
let currentFilter = 'all';

function filterSec(sec, tabEl){
  currentFilter = sec;
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active','sa','sb','sc','sd'));
  tabEl.classList.add('active');
  const colorMap = {all:'sa', a:'sa', b:'sb', c:'sc', d:'sd'};
  tabEl.classList.add(colorMap[sec]||'sa');
  renderCards();
}

function renderCards(){
  const container = document.getElementById('cardsContainer');
  const filtered = currentFilter==='all'
    ? CARDS
    : CARDS.filter(c=>c.sec===currentFilter);

  // Group by section
  const sections = {
    a:{label:'Θέμα Α', sub:'Περίληψη', color:'rust'},
    b:{label:'Θέμα Β', sub:'Σύγκριση · Ύφος · Σημεία στίξης', color:'sage'},
    c:{label:'Θέμα Γ', sub:'Λογοτεχνικό κείμενο · Ερμηνεία', color:'blue'},
    d:{label:'Θέμα Δ', sub:'Παραγωγή λόγου — Άρθρο', color:'violet'}
  };

  const grouped = {};
  filtered.forEach(c=>{
    if(!grouped[c.sec]) grouped[c.sec]=[];
    grouped[c.sec].push(c);
  });

  container.innerHTML = '';
  Object.entries(grouped).forEach(([sec, cards])=>{
    const s = sections[sec];
    const section = document.createElement('div');
    section.className='section-group';
    section.innerHTML=`<div class="section-header">
      <div class="sh-label">${s.label}</div>
      <div class="sh-title">${s.sub}</div>
      <div class="sh-mono">${cards.length} ερωτήσεις</div>
    </div>
    <div class="cards-grid" id="grid-${sec}"></div>`;
    container.appendChild(section);

    const grid = section.querySelector('.cards-grid');
    cards.forEach(card=>{
      grid.appendChild(buildCard(card));
    });
  });

  updateCounter();
}

function buildCard(c){
  const wrap = document.createElement('div');
  wrap.className = `flip-card ${c.size||''} ${openCards.has(c.id)?'flipped':''}`;
  wrap.id = 'card-'+c.id;
  wrap.onclick = ()=>toggleCard(c.id);

  wrap.innerHTML = `
  <div class="flip-inner">
    <div class="flip-front ${c.color}">
      <div class="ff-top">
        <div class="ff-sec">${c.secLabel}</div>
        <div class="ff-q">${c.q}</div>
        <div class="ff-mono">● Κάρτα ερώτησης</div>
      </div>
      <div class="ff-bottom">
        <div class="ff-tap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
          Πάτα για απάντηση
        </div>
        <div class="ff-pts">${c.pts}</div>
      </div>
    </div>
    <div class="flip-back">
      <div class="fb-header">
        <div class="fb-hq">${c.secLabel}</div>
        <div class="fb-hpts">${c.pts}</div>
      </div>
      <div class="fb-body">${c.ans}</div>
      <div class="fb-footer">↩ Πάτα για επιστροφή στην ερώτηση</div>
    </div>
  </div>`;
  return wrap;
}

function toggleCard(id){
  const card = CARDS.find(c=>c.id===id);
  if(!card) return;
  openOverlay(card);
}

function openOverlay(card){
  const overlay = document.getElementById('cardOverlay');
  document.getElementById('overlayLabel').textContent = card.secLabel;
  document.getElementById('overlayPts').textContent = card.pts;
  document.getElementById('overlayBody').innerHTML = card.ans;
  overlay.classList.add('visible');
  openCards.add(card.id);
  updateCounter();
}

function closeOverlay(){
  document.getElementById('cardOverlay').classList.remove('visible');
}

document.getElementById('cardOverlay').addEventListener('click', e=>{
  if(e.target === document.getElementById('cardOverlay')) closeOverlay();
});
document.getElementById('overlayClose').addEventListener('click', closeOverlay);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOverlay(); });

function updateCounter(){
  const filtered = currentFilter==='all' ? CARDS : CARDS.filter(c=>c.sec===currentFilter);
  const open = filtered.filter(c=>openCards.has(c.id)).length;
  document.getElementById('openCount').textContent = open;
  document.getElementById('totalCount').textContent = filtered.length;
}

// Tab event listeners
document.querySelectorAll('.stab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    filterSec(tab.dataset.sec, tab);
  });
});

// Init
renderCards();
</script>
