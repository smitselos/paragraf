<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Παράγραφος</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a2e; --ink2:#3d3d5c; --muted:#6b6b8a; --border:#e2e2f0;
  --bg:#f7f7fc; --white:#fff;
  --indigo:#4f46e5; --indigo-l:#eef2ff; --indigo-d:#3730a3;
  --green:#059669; --green-l:#d1fae5;
  --red:#dc2626; --red-l:#fee2e2;
  --amber:#d97706; --amber-l:#fef3c7;
  --teal:#0891b2; --teal-l:#e0f2fe;
  --r:12px; --sh:0 2px 16px rgba(79,70,229,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:20px 16px 48px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto}

/* header */
.app-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:var(--white);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;border-left:4px solid var(--indigo)}
.app-hdr h1{font-family:'IBM Plex Serif',serif;font-size:1.2rem;font-weight:600}
.app-hdr p{font-size:.78rem;color:var(--muted);margin-top:2px}
.badge{background:var(--indigo-l);color:var(--indigo);padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}

/* card */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:14px}

/* loading */
.loading{text-align:center;padding:60px 20px}
.spin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--indigo);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ HOME SCREEN ══ */
.home-title{font-family:'IBM Plex Serif',serif;font-size:1.6rem;font-weight:600;margin-bottom:6px}
.home-sub{color:var(--muted);font-size:.9rem;margin-bottom:28px}
.home-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:8px}
.home-card{border-radius:var(--r);padding:24px 20px;cursor:pointer;border:2px solid transparent;transition:all .2s;text-align:left;font-family:inherit;background:var(--white);box-shadow:var(--sh)}
.home-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(79,70,229,.13)}
.home-card .hc-icon{font-size:2rem;margin-bottom:12px;display:block}
.home-card .hc-title{font-family:'IBM Plex Serif',serif;font-size:1.05rem;font-weight:600;margin-bottom:6px;color:var(--ink)}
.home-card .hc-desc{font-size:.82rem;color:var(--muted);line-height:1.5}
.home-card.c1{border-color:var(--green);background:linear-gradient(135deg,#f0fdf4,#fff)}
.home-card.c1 .hc-icon-wrap{background:var(--green-l);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:1.3rem}
.home-card.c2{border-color:var(--teal);background:linear-gradient(135deg,#f0f9ff,#fff)}
.home-card.c2 .hc-icon-wrap{background:var(--teal-l);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:1.3rem}
.home-card.c3{border-color:var(--indigo);background:linear-gradient(135deg,var(--indigo-l),#fff)}
.home-card.c3 .hc-icon-wrap{background:var(--indigo-l);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:1.3rem}
.home-card .hc-arrow{display:inline-block;margin-top:14px;font-size:.8rem;font-weight:600;color:var(--muted)}
.home-card.c1 .hc-arrow{color:var(--green)}
.home-card.c2 .hc-arrow{color:var(--teal)}
.home-card.c3 .hc-arrow{color:var(--indigo)}

/* ══ DIAGNOSTIC ══ */
.diag-intro{text-align:center;padding:10px 0 18px}
.diag-intro .d-icon{font-size:2.4rem;margin-bottom:10px}
.diag-intro h2{font-family:'IBM Plex Serif',serif;font-size:1.3rem;font-weight:600;margin-bottom:6px}
.diag-intro p{color:var(--muted);font-size:.875rem}
.diag-steps{display:flex;gap:6px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.diag-step{width:28px;height:6px;border-radius:999px;background:var(--border);transition:background .3s}
.diag-step.done{background:var(--teal)}
.diag-step.active{background:var(--indigo)}

/* diagnostic result */
.diag-result{text-align:center;padding:16px 0}
.diag-result .dr-icon{font-size:3rem;margin-bottom:12px}
.diag-result h2{font-family:'IBM Plex Serif',serif;font-size:1.4rem;font-weight:600;margin-bottom:8px}
.diag-result p{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.level-badge{display:inline-block;padding:8px 24px;border-radius:999px;font-size:1rem;font-weight:700;margin:10px 0 16px}
.level-badge.l1{background:var(--amber-l);color:#92400e}
.level-badge.l2{background:var(--indigo-l);color:var(--indigo-d)}
.level-badge.l3{background:var(--green-l);color:#065f46}
.score-diag{font-size:.875rem;color:var(--muted);margin-bottom:18px}

/* selection */
.sel-title{font-family:'IBM Plex Serif',serif;font-size:1.5rem;font-weight:600;margin-bottom:6px}
.sel-sub{color:var(--muted);margin-bottom:22px;font-size:.9rem}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:7px 16px;border:2px solid var(--border);border-radius:999px;background:var(--white);cursor:pointer;font-size:.875rem;font-family:inherit;transition:all .15s;color:var(--ink2)}
.pill:hover{border-color:#94a3b8}
.pill.on{border-color:var(--indigo);background:var(--indigo);color:#fff;font-weight:600}
.info{background:var(--indigo-l);border-radius:8px;padding:11px 15px;font-size:.875rem;color:var(--indigo-d);margin:14px 0;font-weight:500}
.info.warn{background:var(--amber-l);color:#78350f}
.btn-go{width:100%;padding:14px;border:none;border-radius:var(--r);background:var(--indigo);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px;transition:background .15s}
.btn-go:hover{background:var(--indigo-d)}
.btn-go:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-go.green{background:var(--green)}
.btn-go.green:hover{background:#047857}
.btn-go.teal{background:var(--teal)}
.btn-go.teal:hover{background:#0e7490}

/* progress */
.prog-wrap{margin-bottom:16px}
.prog-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.prog-info span{font-size:.83rem;color:var(--muted)}
.prog-info strong{color:var(--indigo);font-size:1rem}
.prog-bar{background:var(--border);border-radius:999px;height:5px;overflow:hidden}
.prog-fill{background:var(--indigo);height:100%;transition:width .4s ease}
.prog-fill.teal{background:var(--teal)}

/* phase badge */
.ph{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.ph.main{background:var(--indigo-l);color:var(--indigo)}
.ph.retry{background:var(--amber-l);color:var(--amber)}
.ph.deep{background:var(--red-l);color:var(--red)}
.ph.diag{background:var(--teal-l);color:var(--teal)}

/* excerpt */
.exc-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--indigo);margin-bottom:8px}
.exc{font-family:'IBM Plex Serif',serif;background:linear-gradient(135deg,#f8f8ff,#f0f0fa);border-left:3px solid var(--indigo);border-radius:0 8px 8px 0;padding:15px 18px;line-height:1.85;font-size:.96rem;color:var(--ink);text-align:justify;margin-bottom:16px}
.exc.clk{cursor:default}
.tok{cursor:pointer;padding:1px 3px;border-radius:3px;transition:background .12s}
.tok:hover{background:var(--indigo-l)}
.tok.sel{background:var(--indigo);color:#fff}
.tok.hit{background:var(--green);color:#fff}
.tok.miss{background:var(--red);color:#fff}

/* question */
.q-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.q-txt{font-size:.98rem;font-weight:600;color:var(--ink);margin-bottom:14px;line-height:1.5}

/* MC/YN options */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{padding:11px 15px;border:2px solid var(--border);border-radius:10px;background:var(--white);text-align:left;cursor:pointer;font-size:.9rem;font-family:inherit;color:var(--ink);transition:all .15s;display:flex;align-items:center;gap:10px}
.opt:hover:not(:disabled){border-color:#94a3b8}
.opt.sel{border-color:var(--indigo);background:var(--indigo-l)}
.opt.ok{border-color:var(--green);background:var(--green);color:#fff;font-weight:600}
.opt.ko{border-color:var(--red);background:var(--red);color:#fff;font-weight:600}
.opt:disabled{cursor:default}
.opt-k{min-width:22px;height:22px;border-radius:50%;background:var(--border);color:var(--ink2);font-size:.72rem;font-weight:700;text-align:center;line-height:22px;flex-shrink:0}
.opt.ok .opt-k,.opt.ko .opt-k{background:rgba(255,255,255,.3);color:#fff}

/* GAP */
.exc-gap{font-family:'IBM Plex Serif',serif;background:linear-gradient(135deg,#f8f8ff,#f0f0fa);border-left:3px solid var(--indigo);border-radius:0 8px 8px 0;padding:15px 18px;line-height:2.1;font-size:.96rem;color:var(--ink);text-align:justify;margin-bottom:14px}
.gap-inp{display:inline-block;border:none;border-bottom:2px solid var(--indigo);background:transparent;font-family:'IBM Plex Serif',serif;font-size:.96rem;color:var(--indigo);outline:none;min-width:120px;padding:0 4px;text-align:center}
.gap-inp:disabled{color:var(--green);border-color:var(--green)}
.gap-inp.ko{color:var(--red);border-color:var(--red)}

/* DD */
.dd-wrap{width:100%}
.dd-hint{font-size:.78rem;color:var(--muted);font-style:italic;margin-bottom:12px}
.dd-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.dd-col-hdr{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 4px;margin-bottom:4px}
.dd-left-col,.dd-right-col{display:flex;flex-direction:column;gap:6px}
.dd-item{padding:10px 13px;border:2px solid var(--border);border-radius:9px;font-size:.855rem;background:var(--white);cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;transition:all .15s;min-height:42px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dd-item:hover:not(:disabled):not(.paired):not(.ok):not(.ko){border-color:#94a3b8;background:#f8f8ff}
.dd-item.sel{border-color:var(--indigo);background:var(--indigo-l);font-weight:600}
.dd-item.paired{border-color:var(--indigo);background:var(--indigo-l);cursor:default}
.dd-item.ok{border-color:var(--green);background:var(--green-l);cursor:default;color:#065f46;font-weight:600}
.dd-item.ko{border-color:var(--red);background:var(--red-l);cursor:default;color:#7f1d1d}
.dd-slot{padding:10px 13px;border:2px dashed var(--border);border-radius:9px;font-size:.855rem;background:#fafafa;min-height:42px;display:flex;align-items:center;color:var(--muted);font-style:italic;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dd-slot.ready{border-color:var(--indigo);border-style:solid;background:var(--indigo-l);cursor:pointer}
.dd-slot.ready:hover{background:#e0e7ff}
.dd-slot.filled{border-color:var(--indigo);border-style:solid;background:var(--indigo-l);color:var(--ink);font-style:normal;font-weight:600;cursor:pointer}
.dd-slot.filled:hover:not(.ok):not(.ko){background:#dde4ff}
.dd-slot.ok{border-color:var(--green);border-style:solid;background:var(--green-l);color:#065f46;font-style:normal;font-weight:600;cursor:default}
.dd-slot.ko{border-color:var(--red);border-style:solid;background:var(--red-l);color:#7f1d1d;font-style:normal;cursor:default}
.dd-correct-show{margin-top:12px;padding:12px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0}
.dd-correct-show p{font-size:.78rem;color:#065f46;font-weight:600;margin-bottom:8px}
.dd-correct-row{display:grid;grid-template-columns:1fr 20px 1fr;gap:4px;align-items:center;margin-bottom:4px;font-size:.83rem}
.dd-correct-row .dl{padding:6px 10px;background:var(--green-l);border-radius:6px;color:#065f46}
.dd-correct-row .dr{padding:6px 10px;background:var(--green-l);border-radius:6px;color:#065f46}
.dd-correct-row .da{text-align:center;color:var(--muted)}
@media(max-width:480px){
  .dd-cols{grid-template-columns:1fr}
  .dd-right-col{margin-top:4px}
}

/* feedback */
.fb{border-radius:var(--r);padding:14px 16px;margin-top:14px;font-size:.875rem;line-height:1.65}
.fb.ok{background:var(--green-l);border-left:3px solid var(--green)}
.fb.ko{background:var(--red-l);border-left:3px solid var(--red)}
.fb-title{font-weight:700;margin-bottom:5px;font-size:.9rem}
.fb.ok .fb-title{color:#065f46}
.fb.ko .fb-title{color:#7f1d1d}
.fb p{color:var(--ink2)}

/* buttons */
.btn-check{width:100%;padding:13px;border:none;border-radius:var(--r);background:var(--indigo);color:#fff;font-size:.98rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;transition:background .15s}
.btn-check:hover{background:var(--indigo-d)}
.btn-check:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-next{width:100%;padding:13px;border:none;border-radius:var(--r);background:var(--green);color:#fff;font-size:.98rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;transition:background .15s}
.btn-next:hover{background:#047857}
.btn-sec{width:100%;padding:11px;border:2px solid var(--border);border-radius:var(--r);background:var(--white);color:var(--ink2);font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;transition:all .15s}
.btn-sec:hover{border-color:#94a3b8}

/* results */
.res-top{text-align:center;padding:20px 0 14px}
.res-emoji{font-size:3rem;margin-bottom:10px}
.res-title{font-family:'IBM Plex Serif',serif;font-size:1.5rem;font-weight:600}
.score-box{background:var(--indigo-l);border-radius:var(--r);padding:18px;text-align:center;margin:14px 0}
.score-big{font-size:2.8rem;font-weight:700;color:var(--indigo);line-height:1}
.score-pct{color:var(--muted);font-size:.95rem;margin-top:3px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.sc{padding:12px;border-radius:10px;text-align:center}
.sc p:first-child{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.sc p:last-child{font-size:1.3rem;font-weight:700}
.sc.g{background:var(--green-l)} .sc.g p{color:#065f46}
.sc.r{background:var(--red-l)} .sc.r p{color:#7f1d1d}
.sc.a{background:var(--amber-l)} .sc.a p{color:#78350f}

/* retry */
.retry-title{font-family:'IBM Plex Serif',serif;font-size:1.05rem;font-weight:600;margin-bottom:10px}
.retry-cat{background:var(--amber-l);border:1px solid #fcd34d;border-radius:10px;padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.retry-cat-name{font-weight:600;color:#78350f;font-size:.875rem}
.retry-cat-errors{font-size:.78rem;color:#92400e}
.btn-retry{padding:7px 16px;border:none;border-radius:8px;background:var(--amber);color:#fff;font-size:.835rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-retry:hover{background:#b45309}

/* theory */
.theory-box{background:var(--amber-l);border:1px solid #fcd34d;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:.855rem}
.theory-box h4{color:#92400e;margin-bottom:8px;font-size:.875rem}
.theory-box ul{margin-left:16px;color:#78350f}
.theory-box li{margin-bottom:3px}
.theory-needed{background:var(--red-l);border:1px solid #fca5a5;border-radius:var(--r);padding:14px 16px;margin-top:10px}
.theory-needed h4{color:#7f1d1d;margin-bottom:6px;font-size:.875rem;font-weight:700}
.theory-needed p{color:#991b1b;font-size:.855rem}
.theory-toggle{background:none;border:none;color:var(--indigo);cursor:pointer;font-size:.83rem;font-weight:500;padding:4px 0;margin-bottom:6px;font-family:inherit}

@media(max-width:600px){
  .score-grid{grid-template-columns:1fr}
  .dd-grid{grid-template-columns:1fr 24px 1fr}
  .home-cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-hdr">
    <div>
      <h1>Παράγραφος</h1>
      <p>Νεοελληνική Γλώσσα για το Λύκειο</p>
    </div>
    <span class="badge" id="hdrBadge">Quiz</span>
  </div>
  <div id="app"><div class="card loading"><div class="spin"></div><p style="color:var(--muted)">Φόρτωση ερωτήσεων…</p></div></div>
</div>
<footer style="text-align:center;margin-top:32px;padding:16px;font-size:.78rem;color:var(--muted);font-family:'IBM Plex Sans',sans-serif">
  © Α &amp; Σ Μητσέλος, 2026
</footer>

<script>
// ══════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRvQNTsoPcU08XK8mT56x6m-5T0zigqVnyB27VOeXpJnv8smyhKDQChQ9r55jBQN9pDCHB9Fs2W0SAi/pub?gid=1446071944&single=true&output=csv';
const QUIZ_PER_SESSION = 10;

// Ποσοστά διαγνωστικού
const DIAG_THRESHOLDS = { high: 80, mid: 50 }; // >=80% → επ.3, >=50% → επ.2, <50% → επ.1

const CAT_NAMES = {
  1:'Δομή Παραγράφου',
  2:'Αιτιολόγηση vs Αίτιο-αποτέλεσμα',
  3:'Διαίρεση & Σύγκριση-αντίθεση',
  4:'Συνδυασμός Μεθόδων',
  5:'Παραδείγματα & Αναλογία'
};

const CAT_THEORY = {
  1:['Τριμερής δομή: Θεματική περίοδος → Σχόλια → Κατακλείδα','Διμερής δομή: Θεματική περίοδος → Σχόλια (χωρίς κατακλείδα)','Κατακλείδα = τελευταία περίοδος ΜΟΝΟ αν αποτελεί συνολικό συμπέρασμα'],
  2:['Αιτιολόγηση: αποδεικνύει αμφισβητούμενη θέση με επιχειρήματα','Αίτιο-αποτέλεσμα: εξηγεί δεδομένο φαινόμενο (αιτίες ή συνέπειες)','Κριτήριο: η θέση αμφισβητείται → αιτιολόγηση | το φαινόμενο δεδομένο → αίτιο-αποτέλεσμα'],
  3:['Διαίρεση: μία έννοια ταξινομείται στα είδη/μέρη της','Σύγκριση-αντίθεση: δύο έννοιες συγκρίνονται ή αντιτίθενται','Κριτήριο: μία έννοια → διαίρεση | δύο έννοιες → σύγκριση-αντίθεση'],
  4:['Συνδυασμός μεθόδων: κύριος + δευτερεύων τρόπος ανάπτυξης','Κύριος = βασική πρόθεση συγγραφέα | Δευτερεύων = υποστηρικτικός','Αναγνώριση: ποιος τρόπος κυριαρχεί στη δομή της παραγράφου;'],
  5:['Παραδείγματα: συγκεκριμένες περιπτώσεις για τεκμηρίωση γενικής θέσης','Αναλογία: γνωστή εικόνα/κατάσταση που φωτίζει αφηρημένη έννοια','Κριτήριο: αποδεικνύουν → παραδείγματα | επεξηγούν μέσω παραλληλισμού → αναλογία']
};

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let allQ = [];
let state = {
  screen: 'loading',      // loading | home | diagnostic | diag_result | selection | quiz | results | retry | done
  difficulty: null,
  quizQ: [],
  idx: 0,
  answer: null,
  answered: false,
  phase: 'main',          // main | retry | diag
  wrongByCat: {},
  retryWrongByCat: {},
  showTheory: false,
  score: 0,
  diagScore: 0,
  diagTotal: 0,
  diagLevel: null,        // 1 | 2 | 3 — αποτέλεσμα διαγνωστικού
  ddSelected: null,
  ddPairs: {},

// ══════════════════════════════════════════════
// CSV PARSING
// ══════════════════════════════════════════════
function parseCSVLine(line) {
  const res = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
    else if (c === ',' && !inQ) { res.push(cur.trim()); cur=''; }
    else cur += c;
  }
  res.push(cur.trim()); return res;
}

function parseCSV(csv) {
  const lines = csv.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if (lines.length < 2) return [];
  const hdrs = parseCSVLine(lines[0]).map(h=>h.trim());
  const data = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    hdrs.forEach((h,idx) => {
      let v = (vals[idx]||'').trim();
      obj[h] = (v===''||v.toLowerCase()==='null'||v.toLowerCase()==='false') ? null : v;
    });
    if (!obj['Ενεργό'] || obj['Ενεργό'].toUpperCase()==='FALSE') continue;
    if (!obj['Τύπος'] || !obj['Κατηγορία'] || !obj['Κείμενο Ερώτησης']) continue;
    obj.cat = parseInt(obj['Κατηγορία']) || 0;
    obj.diff = parseInt(obj['Δυσκολία']) || 1;
    const diagRaw = (obj['Διαγνωστική']||'').toString().trim(); const diagNum = parseFloat(diagRaw); obj.diagOrder = (!diagRaw || isNaN(diagNum)) ? null : Math.round(diagNum);
    obj.quizId = obj['Quiz_ID'];
    obj.id = obj['ID'];
    obj.type = obj['Τύπος'].trim().toUpperCase();
    obj.q = obj['Κείμενο Ερώτησης'];
    obj.excerpt = obj['Απόσπασμα'] || null;
    obj.optA = obj['Επιλογή Α'] || null;
    obj.optB = obj['Επιλογή Β'] || null;
    obj.optC = obj['Επιλογή Γ'] || null;
    obj.optD = obj['Επιλογή Δ'] || null;
    obj.leftItems  = [obj['Αριστερά 1'],obj['Αριστερά 2'],obj['Αριστερά 3'],obj['Αριστερά 4']].filter(Boolean);
    obj.rightItems = [obj['Δεξιά 1'],   obj['Δεξιά 2'],   obj['Δεξιά 3'],   obj['Δεξιά 4']  ].filter(Boolean);
    obj.targets = obj['Λέξη-Στόχος'] ? obj['Λέξη-Στόχος'].split('|').map(t=>t.trim()).filter(Boolean) : [];
    obj.correct = (obj['Σωστή Απάντηση']||'').trim();
    obj.fb = [obj['Διόρθωση 1'],obj['Διόρθωση 2'],obj['Διόρθωση 3'],obj['Διόρθωση 4']];
    data.push(obj);
  }
  return data;
}

// ══════════════════════════════════════════════
// DATA LOADING
// ══════════════════════════════════════════════
async function loadData() {
  try {
    const r = await fetch(CSV_URL);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const csv = await r.text();
    allQ = parseCSV(csv);
    if (!allQ.length) throw new Error('Δεν βρέθηκαν ερωτήσεις');
    state.screen = 'home';
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center;padding:40px">
        <p style="color:var(--red);font-size:1rem;margin-bottom:12px">⚠️ Αδυναμία φόρτωσης</p>
        <p style="color:var(--muted);font-size:.875rem;margin-bottom:20px">${e.message}</p>
        <button onclick="loadData()" style="padding:10px 24px;background:var(--indigo);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem">Επανάληψη</button>
      </div>`;
    return;
  }
  render();
}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getFiltered(diff) {
  return allQ.filter(q => diff==='all' || q.diff===parseInt(diff));
}

function getDiagnosticQuestions() {
  // Ερωτήσεις με diagOrder !== null, ταξινομημένες κατά αριθμό
  return allQ
    .filter(q => q.diagOrder !== null && !isNaN(q.diagOrder))
    .sort((a,b) => a.diagOrder - b.diagOrder);
}

function pickQuestions(pool, n) {
  const byType = {};
  pool.forEach(q => { if(!byType[q.type]) byType[q.type]=[]; byType[q.type].push(q); });
  const types = Object.keys(byType);
  let picked = [];
  types.forEach(t => { const sh=shuffle(byType[t]); if(sh.length) picked.push(sh[0]); });
  const pickedIds = new Set(picked.map(q=>q.id));
  const rest = shuffle(pool.filter(q=>!pickedIds.has(q.id)));
  for(const q of rest) { if(picked.length>=n) break; picked.push(q); }
  return shuffle(picked).slice(0,n);
}

function calcDiagLevel(correct, total) {
  if (total === 0) return 1;
  const pct = (correct / total) * 100;
  if (pct >= DIAG_THRESHOLDS.high) return 3;
  if (pct >= DIAG_THRESHOLDS.mid) return 2;
  return 1;
}

function getFeedback(q, answer) {
  if (q.type==='MC') {
    const map = {Α:0,Β:1,Γ:2,Δ:3};
    const idx = map[answer] ?? 0;
    return q.fb[idx] || q.fb.find(f=>f) || null;
  }
  return q.fb[0] || null;
}

function checkAnswer(q, answer) {
  if (q.type==='MC' || q.type==='YN') {
    return q.correct.trim().toUpperCase() === answer.trim().toUpperCase();
  }
  if (q.type==='GAP') {
    const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const accepted = q.correct.split('|').map(s=>norm(s));
    const ans = norm(answer);
    return accepted.some(a => a===ans || a.includes(ans) || ans.includes(a));
  }
  if (q.type==='CLK') {
    const targets = q.targets.map(t=>t.trim().toLowerCase());
    const sel = (answer||[]).map(s=>s.trim().toLowerCase());
    return targets.every(t=>sel.includes(t)) && sel.length===targets.length;
  }
  if (q.type==='DD') {
    const correctPairs = parseCorrectDD(q.correct, q.leftItems, q.rightItems);
    if (!correctPairs) return false;
    for(const [li, ri] of Object.entries(answer||{})) {
      if(correctPairs[parseInt(li)] !== parseInt(ri)) return false;
    }
    return Object.keys(answer||{}).length === q.leftItems.length;
  }
  return false;
}

function parseCorrectDD(correctStr, lefts, rights) {
  if (!correctStr) return null;
  const result = {};
  const pairs = correctStr.split('|').map(s=>s.trim()).filter(Boolean);
  for(const p of pairs) {
    const [l,r] = p.split('→').map(s=>s.trim());
    const li = lefts.findIndex(x=>x && (x.trim()===l || 'Αριστερά '+(lefts.indexOf(x)+1)===l));
    const ri = rights.findIndex(x=>x && (x.trim()===r || 'Δεξιά '+(rights.indexOf(x)+1)===r));
    if(li!==-1 && ri!==-1) result[li]=ri;
  }
  if(!Object.keys(result).length) {
    for(const p of pairs) {
      const m = p.match(/Αριστερά\s*(\d+)\s*→\s*Δεξιά\s*(\d+)/);
      if(m) result[parseInt(m[1])-1]=parseInt(m[2])-1;
    }
  }
  return result;
}

  html += `<div class="card">`;
  if (q.excerpt) {
    html += `<p class="exc-lbl">Απόσπασμα</p>`;
    if (q.type==='CLK') html += renderExcerptCLK(q);
    else if (q.type==='GAP') html += renderExcerptGAP(q);
    else html += `<div class="exc">${q.excerpt}</div>`;
  }
  html += `<p class="q-lbl">${qTypeLabel(q.type)}</p>`;
  html += `<p class="q-txt">${q.q}</p>`;
  if (q.type==='MC'||q.type==='YN') html += renderMC(q);
  else if (q.type==='CLK') html += `<p style="font-size:.8rem;color:var(--muted);font-style:italic">Κάντε κλικ στις λέξεις στο απόσπασμα.</p>`;
  else if (q.type==='DD') html += renderDD(q);

  if (state.answered) {
    const ok = checkAnswer(q, state.answer);
    html += `<div class="fb ${ok?'ok':'ko'}">
      <p class="fb-title">${ok?'✅ Σωστά!':'❌ Λάθος'}</p>
      ${!ok?`<p>${getFeedback(q,state.answer)||''}</p>`:''}
    </div>`;
    if (!ok && CAT_THEORY[q.cat]) {
      html += `<div class="theory-needed">
        <h4>📖 Μελέτησε τη θεωρία</h4>
        <p><strong>${CAT_NAMES[q.cat]||''}</strong></p>
        <ul style="margin:8px 0 0 16px;">${CAT_THEORY[q.cat].map(t=>`<li style="font-size:.83rem;color:#991b1b;margin-bottom:3px">${t}</li>`).join('')}</ul>
      </div>`;
    }
    const isLast = state.idx===state.quizQ.length-1;
    html += `<button class="btn-next" id="btnNext">${isLast?'Τέλος ανατροφοδότησης →':'Επόμενη →'}</button>`;
  } else {
    html += `<button class="btn-check" id="btnCheck" ${canCheck(q)?'':'disabled'}>Έλεγξε</button>`;
  }
  html += `</div>`;
  return html;
}

// ── DONE ──────────────────────────────────────────
function renderDone() {
  return `<div class="card" style="text-align:center;padding:36px 20px">
    <div style="font-size:2.8rem;margin-bottom:14px">🏁</div>
    <h2 style="font-family:'IBM Plex Serif',serif;font-size:1.5rem;margin-bottom:8px">Ολοκληρώθηκε!</h2>
    <p style="color:var(--muted);margin-bottom:24px">Έχεις ολοκληρώσει την κύρια φάση και την ανατροφοδότηση.</p>
    <button class="btn-go" id="btnNewQuiz">↩ Αρχική</button>
  </div>`;
}

// ══════════════════════════════════════════════
// SHARED RENDERERS
// ══════════════════════════════════════════════
function qTypeLabel(type) {
  return type==='CLK'?'Εντοπισμός':type==='DD'?'Αντιστοίχιση':type==='GAP'?'Συμπλήρωση κενού':type==='YN'?'Ναι / Όχι':'Πολλαπλή επιλογή';
}

function canCheck(q) {
  if (!state.answered) {
    if (q.type==='MC'||q.type==='YN') return state.answer!==null;
    if (q.type==='CLK') return state.clkSelected.length>0;
    if (q.type==='DD') return Object.keys(state.ddPairs).length===q.leftItems.length;
    if (q.type==='GAP') return true;
  }
  return false;
}

function renderMC(q) {
  const keys = ['Α','Β','Γ','Δ'];
  const vals = [q.optA,q.optB,q.optC,q.optD].filter(Boolean);
  let html = '<div class="opts">';
  vals.forEach((v,i) => {
    const k = keys[i];
    let cls = 'opt';
    if (state.answered) {
      if (k===q.correct.trim().toUpperCase()) cls+=' ok';
      else if (k===state.answer) cls+=' ko';
    } else {
      if (state.answer===k) cls+=' sel';
    }
    html += `<button class="${cls}" data-opt="${k}" ${state.answered?'disabled':''}>
      <span class="opt-k">${k}</span>${v}
    </button>`;
  });
  html += '</div>';
  return html;
}

function renderExcerptCLK(q) {
  const targets = q.targets.map(t=>t.trim().toLowerCase());
  const text = q.excerpt;
  const tokens = text.split(/(\s+)/);
  let html = '<div class="exc clk" id="excClk">';
  tokens.forEach((tok) => {
    if (/^\s+$/.test(tok)) { html += tok; return; }
    const clean = tok.replace(/[.,;:!?«»"'()\[\]]/g,'').toLowerCase();
    const partOfTarget = targets.some(t => t.split(' ').some(tw=>tw===clean) || t===clean);
    let cls = 'tok';
    if (state.answered) {
      const wasSelected = state.clkSelected.some(s=>s.toLowerCase()===clean);
      if (partOfTarget) cls += wasSelected ? ' hit' : ' miss';
      else if (wasSelected) cls += ' miss';
    } else {
      if (state.clkSelected.map(s=>s.toLowerCase()).includes(clean)) cls += ' sel';
    }
    html += `<span class="${cls}" data-word="${tok.replace(/"/g,'&quot;')}">${tok}</span>`;
  });
  html += '</div>';
  return html;
}

function renderExcerptGAP(q) {
  if (!q.excerpt) return '';
  const GAP_MARKER = '__________';
  const parts = q.excerpt.split(GAP_MARKER);
  if (parts.length < 2) {
    const parts2 = q.excerpt.split('_____');
    if (parts2.length >= 2) {
      return `<div class="exc-gap">${parts2[0]}<input class="gap-inp" id="gapInp" type="text" placeholder="…" autocomplete="off" ${state.answered?'disabled':''}>${parts2.slice(1).join('_____')}</div>`;
    }
    return `<div class="exc">${q.excerpt}</div><input class="gap-inp" id="gapInp" type="text" placeholder="Συμπλήρωσε…" style="width:100%;margin-top:10px" autocomplete="off" ${state.answered?'disabled':''}>`;
  }
  return `<div class="exc-gap">${parts[0]}<input class="gap-inp" id="gapInp" type="text" placeholder="…" autocomplete="off" ${state.answered?'disabled':''}>${parts.slice(1).join(GAP_MARKER)}</div>`;
}

function renderDD(q) {
  // Αρχικοποίηση ανακατεμένης δεξιάς λίστας (σταθερή ανά ερώτηση)
  if (!q._shuffledRight) {
    q._shuffledRight = shuffle(q.rightItems.map((r,i)=>({r,i})));
  }
  const shuffledRight = q._shuffledRight;

  let html = '<div class="dd-wrap">';

  if (state.answered) {
    // ── ΑΠΟΤΕΛΕΣΜΑ ──
    const correctPairs = parseCorrectDD(q.correct, q.leftItems, q.rightItems);
    html += '<div class="dd-cols">';
    html += '<div><div class="dd-col-hdr">Αριστερά</div><div class="dd-left-col">';
    q.leftItems.forEach((l,li)=>{
      const myRi = state.ddPairs[li];
      const correctRi = correctPairs?.[li];
      const isOk = myRi===correctRi;
      html += `<div class="dd-item ${isOk?'ok':'ko'}">${l}</div>`;
    });
    html += '</div></div>';
    html += '<div><div class="dd-col-hdr">Απάντησες</div><div class="dd-right-col">';
    q.leftItems.forEach((_,li)=>{
      const myRi = state.ddPairs[li];
      const correctRi = correctPairs?.[li];
      const isOk = myRi===correctRi;
      const rText = myRi!==undefined ? q.rightItems[myRi] : '—';
      html += `<div class="dd-slot ${isOk?'ok':'ko'}">${rText}</div>`;
    });
    html += '</div></div>';
    html += '</div>'; // dd-cols

    // Σωστές αντιστοιχίσεις αν υπάρχουν λάθη
    const allOk = q.leftItems.every((_,li)=>state.ddPairs[li]===correctPairs?.[li]);
    if (!allOk && correctPairs) {
      html += '<div class="dd-correct-show"><p>✅ Σωστές αντιστοιχίσεις:</p>';
      q.leftItems.forEach((l,li)=>{
        const ri = correctPairs[li];
        html += `<div class="dd-correct-row"><div class="dl">${l}</div><div class="da">→</div><div class="dr">${q.rightItems[ri]||'—'}</div></div>`;
      });
      html += '</div>';
    }

  } else {
    // ── ΑΛΛΗΛΕΠΙΔΡΑΣΗ ──
    // Βήμα 1: επίλεξε αριστερά  Βήμα 2: επίλεξε δεξιά slot
    const selLeft = state.ddSelected; // "L0", "L1" κλπ ή null
    const selLeftIdx = selLeft ? parseInt(selLeft.slice(1)) : null;

    // Οδηγίες
    if (selLeft === null) {
      html += '<p class="dd-hint">👆 Επίλεξε ένα στοιχείο <strong>αριστερά</strong></p>';
    } else {
      html += `<p class="dd-hint" style="color:var(--indigo);font-style:normal">➡️ Τώρα επίλεξε το αντίστοιχο <strong>δεξιά</strong></p>`;
    }

    html += '<div class="dd-cols">';

    // Αριστερή στήλη — σταθερά στοιχεία
    html += '<div><div class="dd-col-hdr">Στήλη Α</div><div class="dd-left-col">';
    q.leftItems.forEach((l,li)=>{
      const paired = state.ddPairs[li] !== undefined;
      const isSel = selLeftIdx === li;
      let cls = 'dd-item';
      if (paired) cls += ' paired';
      else if (isSel) cls += ' sel';
      html += `<button class="${cls}" data-dd-l="${li}" ${paired?'disabled':''}>${paired ? '✓ '+l : l}</button>`;
    });
    html += '</div></div>';

    // Δεξιά στήλη — slots αντιστοίχισης
    html += '<div><div class="dd-col-hdr">Στήλη Β</div><div class="dd-right-col">';
    shuffledRight.forEach(({r,i})=>{
      const usedByLeft = Object.entries(state.ddPairs).find(([,ri])=>ri===i);
      if (usedByLeft) {
        // Slot γεμάτο — δείχνει τιμή, κλικ για αναίρεση
        const li = parseInt(usedByLeft[0]);
        html += `<button class="dd-slot filled" data-dd-unpair="${li}" title="Κλικ για αναίρεση">↩ ${r}</button>`;
      } else {
        // Slot κενό — ενεργό μόνο αν έχει επιλεγεί αριστερά στοιχείο
        const isReady = selLeft !== null;
        html += `<button class="dd-slot ${isReady?'ready':''}" data-dd-r="${i}" ${!isReady?'disabled':''}>${isReady?r:'—'}</button>`;
      }
    });
    html += '</div></div>';

    html += '</div>'; // dd-cols
  }

  html += '</div>'; // dd-wrap
  return html;
}

// ══════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════
function attachEvents() {
  // HOME
  const btnSL1 = document.getElementById('btnStartL1');
  if (btnSL1) btnSL1.addEventListener('click', () => startQuiz(1));

  const btnDiag = document.getElementById('btnDiag');
  if (btnDiag) btnDiag.addEventListener('click', () => {
    const dq = getDiagnosticQuestions();
    if (!dq.length) return;
    startDiagnostic(dq);
  });

  const btnSel = document.getElementById('btnSel');
  if (btnSel) btnSel.addEventListener('click', () => { state.screen='selection'; state.difficulty=null; render(); });

  // HOME back buttons
  const btnHS = document.getElementById('btnHomeFromSel');
  if (btnHS) btnHS.addEventListener('click', () => { state.screen='home'; render(); });
  const btnHD = document.getElementById('btnHomeFromDiag');
  if (btnHD) btnHD.addEventListener('click', () => { state.screen='home'; render(); });

  // SELECTION
  document.querySelectorAll('[data-diff]').forEach(b =>
    b.addEventListener('click', ()=>{ state.difficulty=isNaN(b.dataset.diff)?b.dataset.diff:parseInt(b.dataset.diff); render(); }));
  const btnStart = document.getElementById('btnStart');
  if (btnStart) btnStart.addEventListener('click', () => startQuiz(state.difficulty));

  // DIAG RESULT
  const btnSD = document.getElementById('btnStartFromDiag');
  if (btnSD) btnSD.addEventListener('click', () => startQuiz(state.diagLevel));

  // THEORY TOGGLE
  const btnTh = document.getElementById('btnTheory');
  if (btnTh) btnTh.addEventListener('click', ()=>{ state.showTheory=!state.showTheory; render(); });

  // MC/YN
  document.querySelectorAll('[data-opt]').forEach(b =>
    b.addEventListener('click', ()=>{ if(!state.answered){ state.answer=b.dataset.opt; render(); }}));

  // CLK
  document.querySelectorAll('[data-word]').forEach(b =>
    b.addEventListener('click', ()=>{
      if (state.answered) return;
      const w = b.dataset.word.replace(/[.,;:!?«»"'()\[\]]/g,'').trim();
      const idx2 = state.clkSelected.indexOf(w);
      if (idx2!==-1) state.clkSelected.splice(idx2,1);
      else state.clkSelected.push(w);
      render();
    }));

  // DD — αριστερά
  document.querySelectorAll('[data-dd-l]').forEach(b =>
    b.addEventListener('click', ()=>{
      if (state.answered) return;
      const li = parseInt(b.dataset.ddL);
      state.ddSelected = state.ddSelected===`L${li}` ? null : `L${li}`;
      render();
    }));

  // DD — δεξιά (αντιστοίχιση)
  document.querySelectorAll('[data-dd-r]').forEach(b =>
    b.addEventListener('click', ()=>{
      if (state.answered) return;
      if (state.ddSelected && state.ddSelected.startsWith('L')) {
        const li = parseInt(state.ddSelected.slice(1));
        const ri = parseInt(b.dataset.ddR);
        state.ddPairs[li] = ri;
        state.ddSelected = null;
        render();
      }
    }));

  // DD — αναίρεση (unpair)
  document.querySelectorAll('[data-dd-unpair]').forEach(b =>
    b.addEventListener('click', ()=>{
      if (state.answered) return;
      const li = parseInt(b.dataset.ddUnpair);
      delete state.ddPairs[li];
      state.ddSelected = null;
      render();
    }));

  // GAP
  const gapInp = document.getElementById('gapInp');
  if (gapInp) {
    if (state.answer) gapInp.value = state.answer;
    gapInp.addEventListener('input', ()=>{ state.answer = gapInp.value; });
    gapInp.addEventListener('keydown', e=>{ if(e.key==='Enter'&&state.answer) doCheck(); });
  }

  // CHECK / NEXT
  const btnCheck = document.getElementById('btnCheck');
  if (btnCheck) btnCheck.addEventListener('click', doCheck);
  const btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.addEventListener('click', doNext);

  // RETRY
  document.querySelectorAll('[data-retry-cat]').forEach(b =>
    b.addEventListener('click', ()=> startRetry(parseInt(b.dataset.retryCat))));

  // NEW QUIZ / HOME
  const btnNQ = document.getElementById('btnNewQuiz');
  if (btnNQ) btnNQ.addEventListener('click', () => { state.screen='home'; render(); });
}

// ══════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════
function resetQuizState() {
  state.idx = 0;
  state.answer = null;
  state.answered = false;
  state.ddPairs = {};
  state.ddSelected = null;
  state.clkSelected = [];
  state.showTheory = false;
  state.score = 0;
  state.wrongByCat = {};
}

function startDiagnostic(diagQ) {
  resetQuizState();
  state.quizQ = diagQ;
  state.phase = 'diag';
  state.diagScore = 0;
  state.diagTotal = diagQ.length;
  state.screen = 'diagnostic';
  render();
}

function startQuiz(diff) {
  const pool = getFiltered(diff);
  resetQuizState();
  state.quizQ = pickQuestions(pool, QUIZ_PER_SESSION);
  state.difficulty = diff;
  state.phase = 'main';
  state.screen = 'quiz';
  render();
}

function doCheck() {
  const q = state.quizQ[state.idx];
  if (q.type==='GAP') {
    const inp = document.getElementById('gapInp');
    state.answer = inp ? inp.value.trim() : state.answer;
  }
  if (q.type==='CLK') state.answer = [...state.clkSelected];
  if (q.type==='DD') state.answer = {...state.ddPairs};

  state.answered = true;
  const ok = checkAnswer(q, state.answer);

  if (state.phase==='diag') {
    if (ok) state.diagScore++;
  } else if (ok) {
    state.score++;
  } else if (state.phase==='main') {
    if (!state.wrongByCat[q.cat]) state.wrongByCat[q.cat]=[];
    state.wrongByCat[q.cat].push(q.id);
  }
  render();
}

function doNext() {
  if (state.idx < state.quizQ.length-1) {
    state.idx++;
    state.answer = null;
    state.answered = false;
    state.ddPairs = {};
    state.ddSelected = null;
    state.clkSelected = [];
    render();
  } else {
    if (state.phase==='diag') {
      // υπολογισμός επιπέδου
      state.diagLevel = calcDiagLevel(state.diagScore, state.diagTotal);
      state.screen = 'diag_result';
      render();
    } else if (state.phase==='main') {
      state.screen = 'results';
      render();
    } else {
      state.screen = 'done';
      render();
    }
  }
}

function startRetry(cat) {
  const wrongIds = state.wrongByCat[cat] || [];
  const sameWrong = allQ.filter(q=>wrongIds.includes(q.id));
  const samePool = allQ.filter(q=>q.cat===cat && !wrongIds.includes(q.id));
  const extra = shuffle(samePool).slice(0,2);
  const retrySet = shuffle([...sameWrong.slice(0,1), ...extra]).slice(0,3);
  if (!retrySet.length) return;

  state.quizQ = retrySet;
  state.idx = 0;
  state.answer = null;
  state.answered = false;
  state.phase = 'retry';
  state.ddPairs = {};
  state.ddSelected = null;
  state.clkSelected = [];
  state.score = 0;
  state.screen = 'retry';
  render();
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
loadData();
</script>
