<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 Το Δοκίμιο — Βώρος & Σεφέρης</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#1C1B2E; --ink-mid:#3B3650; --ink-light:#5A5470;
  --parchment:#FAF7F0; --parchment-dark:#EFE8D8; --parchment-darker:#DDD3BE;
  --purple:#5B4E8C; --purple-light:#7B6AAC; --purple-dark:#3D3460;
  --gold:#C8952A; --gold-light:#E8B84A;
  --green:#059669; --red:#DC2626; --shadow:rgba(28,27,46,0.13);
}
body{font-family:'Source Sans 3',sans-serif;background:var(--parchment);min-height:100vh;font-size:17px;color:var(--ink);}

/* HEADER */
.header{background:linear-gradient(150deg,var(--ink) 0%,var(--purple-dark) 65%,var(--ink-mid) 100%);color:white;box-shadow:0 6px 28px rgba(0,0,0,0.32);overflow:hidden;position:relative;}
.header::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.025) 0,rgba(255,255,255,0.025) 1px,transparent 1px,transparent 30px);}
.header-inner{max-width:1200px;margin:0 auto;padding:26px 28px 20px;position:relative;}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;}
.badge{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light);background:rgba(200,149,42,0.15);border:1px solid rgba(200,149,42,0.4);padding:5px 13px;border-radius:2px;display:inline-block;margin-bottom:9px;}
.header h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:900;line-height:1.15;}
.header h1 span{color:var(--gold-light);font-style:italic;}
.header-sub{font-size:16px;color:rgba(255,255,255,0.78);margin-top:5px;font-weight:300;}
.pts-box{background:rgba(0,0,0,0.22);border:1px solid rgba(200,149,42,0.4);border-radius:8px;padding:11px 18px;min-width:120px;text-align:right;}
.pts-lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);}
.pts-val{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--gold-light);line-height:1;}
.prog-bar{width:100%;height:5px;background:rgba(255,255,255,0.12);border-radius:10px;margin-top:16px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:10px;transition:width .6s ease;}

/* NAV */
.nav{background:var(--purple-dark);border-bottom:3px solid var(--gold);}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;}
.nav-btn{padding:13px 24px;border:none;font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;background:transparent;color:rgba(255,255,255,0.58);border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;transition:all .2s;}
.nav-btn:hover{color:var(--gold-light);background:rgba(255,255,255,0.05);}
.nav-btn.active{color:var(--gold-light);border-bottom-color:var(--gold);background:rgba(200,149,42,0.1);}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:22px 18px;}

/* CARD */
.card{background:white;border-radius:10px;padding:28px;box-shadow:0 4px 20px var(--shadow);border:1px solid var(--parchment-darker);margin-bottom:18px;}

/* SECTION TABS */
.sec-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.sec-tab{flex:1;min-width:130px;padding:11px 14px;border-radius:6px;border:2px solid var(--parchment-darker);font-size:13px;font-weight:600;letter-spacing:.5px;cursor:pointer;background:var(--parchment);color:var(--ink-mid);transition:all .2s;}
.sec-tab:hover{border-color:var(--purple);color:var(--purple);}
.sec-tab.active{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:white;border-color:var(--purple-dark);box-shadow:0 4px 12px rgba(91,78,140,0.3);}

/* TABLES */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15.5px;}
thead tr{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:white;}
thead th{padding:12px 16px;text-align:left;font-weight:700;font-size:14px;letter-spacing:.5px;}
tbody tr:nth-child(even){background:var(--parchment);}
tbody tr:hover{background:#F0EAF8;}
tbody td{padding:11px 16px;border-bottom:1px solid var(--parchment-darker);vertical-align:top;line-height:1.55;}
tbody td:first-child{font-weight:700;color:var(--purple);white-space:nowrap;}
.tbl-label{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;letter-spacing:.5px;}
.lbl-k1{background:#EDE9FB;color:var(--purple-dark);}
.lbl-k2{background:#FFF3DC;color:#7A5500;}

/* SCHEMA BOX */
.schema{display:grid;gap:10px;margin:14px 0;}
.schema-2{grid-template-columns:1fr 1fr;}
.schema-3{grid-template-columns:1fr 1fr 1fr;}
.schema-item{background:var(--parchment);border-radius:8px;padding:14px 16px;border-left:4px solid var(--purple);box-shadow:0 2px 6px var(--shadow);}
.schema-item.gold-border{border-left-color:var(--gold);}
.schema-item.green-border{border-left-color:var(--green);}
.schema-item h4{font-family:'Playfair Display',serif;font-size:14px;color:var(--purple);margin-bottom:6px;}
.schema-item.gold-border h4{color:var(--gold);}
.schema-item ul{padding-left:18px;}
.schema-item li{font-size:15px;margin-bottom:5px;line-height:1.5;}

/* ARROW DIAGRAM */
.arrow-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0;}
.arrow-box{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:white;padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;text-align:center;flex:1;min-width:120px;}
.arrow-box.gold{background:linear-gradient(135deg,var(--gold),#A07010);}
.arrow{font-size:22px;color:var(--ink-light);}

/* QUOTE */
.quote{background:linear-gradient(135deg,#F5F0FF,#EDE9FB);border-left:4px solid var(--purple);border-radius:6px;padding:16px 20px;margin:14px 0;font-style:italic;font-size:16px;line-height:1.7;}
.quote small{font-style:normal;font-weight:700;color:var(--purple);display:block;margin-top:6px;}

/* BUTTON GROUP */
.btn-group{display:flex;justify-content:space-between;margin-top:24px;padding-top:18px;border-top:1px solid var(--parchment-darker);}
.btn{padding:11px 24px;border-radius:6px;border:none;font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .22s;}
.btn-prev{background:var(--parchment-dark);color:var(--ink-mid);}
.btn-prev:hover:not(:disabled){background:var(--parchment-darker);}
.btn-prev:disabled{opacity:.35;cursor:not-allowed;}
.btn-next{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:white;box-shadow:0 4px 12px rgba(91,78,140,0.28);}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(91,78,140,0.38);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#A07010);color:white;box-shadow:0 4px 12px rgba(200,149,42,0.3);}
.continue-btn{margin-top:13px;padding:12px 28px;border-radius:6px;border:none;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:white;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:700;transition:all .22s;box-shadow:0 4px 12px rgba(91,78,140,0.28);}
.continue-btn:hover{transform:translateY(-2px);}

/* SUCCESS */
.success-box{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border:2px solid #4CAF50;border-radius:8px;padding:20px;text-align:center;margin-top:20px;}
.success-box p{font-weight:700;font-size:17px;color:#1B5E20;}

/* EXERCISES */
.ex-nums{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
.ex-num{width:40px;height:40px;border-radius:50%;border:2px solid var(--parchment-darker);font-weight:700;font-size:14px;cursor:pointer;background:var(--parchment);color:var(--ink-mid);transition:all .18s;}
.ex-num:hover{border-color:var(--purple);color:var(--purple);}
.ex-num.active{background:var(--purple);color:white;border-color:var(--purple-dark);}
.ex-num.done{background:var(--green);color:white;border-color:#047857;}
.ex-tag{display:inline-block;padding:4px 13px;background:var(--purple);color:white;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:16px;}
.question{font-size:20px;font-weight:700;color:var(--purple-dark);line-height:1.5;margin:18px 0;}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:11px;margin-top:16px;}
.opt-btn{padding:16px 20px;border-radius:8px;border:2px solid var(--parchment-darker);background:var(--parchment);cursor:pointer;text-align:left;font-size:16px;transition:all .22s;color:var(--ink);font-family:'Source Sans 3',sans-serif;}
.opt-btn:hover{border-color:var(--purple-light);background:#F5F0FF;transform:translateX(4px);}
.opt-btn.sel{border-color:var(--purple);background:#F0EAF8;font-weight:700;}
.opt-btn.correct{border-color:var(--green);background:#D1FAE5;font-weight:700;}
.opt-btn.wrong{border-color:var(--red);background:#FEE2E2;}

.submit-btn{margin-top:18px;padding:14px 30px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--green),#047857);color:white;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:16px;font-weight:700;transition:all .22s;box-shadow:0 4px 12px rgba(5,150,105,0.3);}
.submit-btn:hover{transform:translateY(-2px);}
.submit-btn:disabled{background:#D1D5DB;cursor:not-allowed;transform:none;box-shadow:none;}

.result-box{margin-top:16px;padding:16px;border-radius:8px;font-size:17px;font-weight:700;text-align:center;}
.result-box.correct{background:#D1FAE5;border:2px solid var(--green);color:#065F46;}
.result-box.incorrect{background:#FEF3C7;border:2px solid var(--gold);color:#7A5500;}

/* TRUE/FALSE */
.tf-item{background:var(--parchment);border-radius:8px;padding:16px 18px;margin-bottom:12px;border:1px solid var(--parchment-darker);}
.tf-text{font-weight:600;font-size:16px;margin-bottom:10px;}
.tf-btns{display:flex;gap:10px;}
.tf-btn{flex:1;padding:10px;border-radius:6px;border:2px solid var(--parchment-darker);background:white;cursor:pointer;font-weight:700;font-size:15px;transition:all .18s;font-family:'Source Sans 3',sans-serif;}
.tf-btn:hover{border-color:var(--purple);}
.tf-btn.sel{border-color:var(--purple);background:#F0EAF8;color:var(--purple);}
.tf-btn.correct-ans{border-color:var(--green);background:#D1FAE5;color:#065F46;}

/* FILL BLANKS */
.fill-area{background:var(--parchment);padding:20px;border-radius:8px;line-height:3;font-size:17px;}
.blank-inp{display:inline-block;min-width:140px;padding:4px 10px;border:2px solid var(--purple);border-radius:5px;font-weight:700;margin:0 5px;font-size:15px;background:white;font-family:'Source Sans 3',sans-serif;}
.blank-inp.ok{background:#D1FAE5;border-color:var(--green);}
.blank-inp.err{background:#FEE2E2;border-color:var(--red);}

/* MATCHING */
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:18px 0;}
.match-col h4{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--purple);margin-bottom:10px;text-align:center;}
.match-item{padding:13px 16px;background:var(--parchment);border:2px solid var(--parchment-darker);border-radius:8px;cursor:pointer;font-weight:600;text-align:center;margin-bottom:9px;transition:all .22s;font-size:15px;}
.match-item:hover{border-color:var(--purple);background:#F5F0FF;}
.match-item.sel-l{border-color:var(--purple);background:#F0EAF8;}
.match-item.matched{border-color:var(--green);background:#D1FAE5;cursor:default;}
.match-item.wrong-m{border-color:var(--red);background:#FEE2E2;}

/* DRAG */
.drag-box{background:var(--parchment);border-radius:8px;padding:16px;margin:18px 0;border:1px solid var(--parchment-darker);}
.drag-flex{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;}
.drag-item{padding:9px 15px;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:white;border-radius:6px;cursor:grab;font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(91,78,140,0.28);user-select:none;transition:all .18s;}
.drag-item:hover{transform:translateY(-2px);}
.slot{min-height:54px;background:var(--parchment);border:2px dashed var(--parchment-darker);border-radius:8px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;font-size:14px;font-weight:700;color:#aaa;transition:all .18s;}
.slot:hover{border-color:var(--purple);background:#F5F0FF;}
.slot.filled{background:#F0EAF8;border:2px solid var(--purple);color:var(--ink);}

/* QUIZ */
.quiz-card{background:white;border-radius:10px;padding:36px;text-align:center;box-shadow:0 4px 20px var(--shadow);}
.quiz-score-box{background:var(--parchment);padding:26px;border-radius:10px;margin:18px 0;border:3px solid var(--gold);}
.quiz-score{font-family:'Playfair Display',serif;font-size:48px;color:var(--gold);font-weight:700;}

/* GLOSSARY */
.glos-item{margin-bottom:14px;padding:16px 20px;background:var(--parchment);border-left:4px solid var(--purple);border-radius:6px;box-shadow:0 2px 6px var(--shadow);transition:all .22s;}
.glos-item:hover{transform:translateX(4px);}
.glos-hd{display:flex;align-items:center;margin-bottom:7px;}
.glos-icon{font-size:24px;margin-right:11px;}
.glos-term{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--purple);}
.glos-def{font-size:15px;line-height:1.6;color:var(--ink);padding-left:35px;}

footer{background:var(--ink);color:rgba(255,255,255,0.65);padding:18px;text-align:center;margin-top:36px;}
footer p{font-size:13px;margin:3px 0;}
footer strong{color:var(--gold-light);}
.hidden{display:none;}
h2{font-family:'Playfair Display',serif;font-size:20px;color:var(--purple-dark);margin-bottom:16px;}
@media(max-width:768px){
  .schema-2,.schema-3,.match-wrap{grid-template-columns:1fr;}
  .header h1{font-size:24px;}
  .header-top{flex-direction:column;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="badge">Νεοελληνική Γλώσσα | Α΄ Λυκείου</div>
        <h1>📝 Το <span>Δοκίμιο</span></h1>
        <div class="header-sub" style="font-size:15px;color:rgba(255,255,255,0.75);margin-top:5px;">Φ.Κ. Βώρος • Γ. Σεφέρης — Παράδοση και αλλαγή</div>
      </div>
      <div class="pts-box">
        <div class="pts-lbl">Πόντοι</div>
        <div class="pts-val">⭐ <span id="pts">0</span></div>
      </div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
</header>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" id="navTh" onclick="switchTab('th')">📋 ΘΕΩΡΙΑ</button>
    <button class="nav-btn" id="navCmp" onclick="switchTab('cmp')">⚖️ ΣΥΓΚΡΙΣΗ</button>
    <button class="nav-btn" id="navEx" onclick="switchTab('ex')">✏️ ΑΣΚΗΣΕΙΣ</button>
    <button class="nav-btn" id="navGl" onclick="switchTab('gl')">📖 ΓΛΩΣΣΑΡΙΟ</button>
  </div>
</nav>

<div class="main">

  <!-- ΘΕΩΡΙΑ -->
  <div id="thTab" class="card">
    <div class="sec-tabs">
      <button class="sec-tab active" onclick="switchTh(0)">📝 Τι είναι Δοκίμιο</button>
      <button class="sec-tab" onclick="switchTh(1)">🔀 Είδη Δοκιμίου</button>
    </div>
    <div id="thContent"></div>
  </div>

  <!-- ΣΥΓΚΡΙΣΗ -->
  <div id="cmpTab" class="card hidden">
    <div id="cmpContent"></div>
  </div>

  <!-- ΑΣΚΗΣΕΙΣ -->
  <div id="exTab" class="hidden">
    <div class="ex-nums" id="exNums"></div>
    <div class="card" id="exContent"></div>
  </div>

  <!-- QUIZ -->
  <div id="quizTab" class="hidden">
    <div id="quizContent"></div>
  </div>

  <!-- ΓΛΩΣΣΑΡΙΟ -->
  <div id="glTab" class="card hidden">
    <h2>📖 Γλωσσάριο</h2>
    <div id="glContent"></div>
  </div>

</div>

<footer>
  <p>📚 <strong>Νεοελληνική Γλώσσα Α΄ Λυκείου</strong> — Κ. Βώρος, Γ. Σεφέρης</p>
  <p>© 2ο ΓΕΛ, 2026</p>
</footer>

<script>
// ══ STATE ══════════════════════════════════════════════════════
const S = {
  tab:'th', thSec:0, exIdx:0, pts:0,
  done:{th:false,cmp:false,ex:false},
  ans:{}, shown:{}, kwHl:[], fillBlanks:{},
  slots:[null,null,null,null], dragged:null,
  matchSel:null, matchPairs:{}, quizAns:[], quizDone:false
};

// ══ GLOSSARY DATA ══════════════════════════════════════════════
const glossary = [
  {icon:'📝',term:'ΔΟΚΙΜΙΟ',def:'Κειμενικό είδος που κινείται ανάμεσα στον επιστημονικό και λογοτεχνικό λόγο. Σοβαρός συγγραφέας απευθύνεται σε μέσο μορφωμένο κοινό για ένα θέμα γενικού ενδιαφέροντος.'},
  {icon:'⚖️',term:'ΔΟΚΙΜΙΟ ΠΕΙΘΟΥΣ',def:'Εστιάζει στην εξήγηση, επιχειρηματολογία και πειθώ. Οργανωμένο λογικά, κοντά στον επιστημονικό λόγο. Χαρακτηρίζεται από αντικειμενικότητα, ορθολογική δομή, παραδείγματα. Παράδειγμα: κείμενο Βώρου.'},
  {icon:'💭',term:'ΔΟΚΙΜΙΟ ΣΤΟΧΑΣΜΟΥ',def:'Εστιάζει στην έκφραση προσωπικών σκέψεων και συναισθημάτων. Κοντά στον λογοτεχνικό λόγο, με ποιητικές εικόνες, βιωματικό χαρακτήρα, α΄ ενικό πρόσωπο. Παράδειγμα: κείμενο Σεφέρη.'},
  {icon:'📖',term:'ΕΘΙΜΙΚΟΣ ΛΟΓΟΣ',def:'Ο λόγος που χαρακτηρίζεται από υψηλό επίπεδο, επιμελημένο λεξιλόγιο, ποικιλία εκφραστικών σχημάτων και προσεγμένη στίξη — γνώρισμα του δοκιμίου.'},
  {icon:'🎯',term:'ΠΡΟΘΕΣΗ ΣΥΝΤΑΚΤΗ',def:'Ο σκοπός που επιδιώκει ο συγγραφέας: να εξηγήσει, να πείσει, να εκφράσει, να προβληματίσει ή να ευαισθητοποιήσει τον αναγνώστη.'},
  {icon:'🔗',term:'ΕΠΙΚΟΙΝΩΝΙΑΚΗ ΛΕΙΤΟΥΡΓΙΑ',def:'Η λειτουργία που επιτελεί ο λόγος: περιγραφή, αφήγηση, εξήγηση, επιχειρηματολογία, οδηγίες. Στο δοκίμιο συνδυάζονται συχνά περισσότερες από μία.'},
  {icon:'🌊',term:'ΠΟΙΗΤΙΚΗ ΛΕΙΤΟΥΡΓΙΑ',def:'Η χρήση εκφραστικών μέσων (μεταφορές, εικόνες, παρομοιώσεις) που μεταμορφώνει τη γλώσσα σε λογοτεχνική. Κυρίαρχο στοιχείο στο δοκίμιο στοχασμού (Σεφέρης).'},
  {icon:'💡',term:'ΠΑΡΑΔΟΞΟΛΟΓΙΑ',def:'Διατύπωση που φαίνεται αντιφατική αλλά περιέχει αλήθεια. Ο Βώρος αρχίζει με παραδοξολογία: &#171;το μονιμότερο γνώρισμα της παράδοσης είναι ότι αυτή βεβαιώνει την ασταμάτητη αλλαγή&#187;.'}
];

// ══ THEORY DATA ════════════════════════════════════════════════
const thSections = [
  // 0 — Τι είναι δοκίμιο
  () => `
    <h2>📝 Τι είναι το Δοκίμιο</h2>
    <div class="arrow-flow" style="margin-bottom:20px;">
      <div class="arrow-box" style="background:linear-gradient(135deg,#3B3650,#1C1B2E);">Επιστημονικός Λόγος</div>

// ══ TAB SWITCHING ══════════════════════════════════════════════
function switchTab(t){
  S.tab=t;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  ['thTab','cmpTab','exTab','quizTab','glTab'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  if(t==='th'){document.getElementById('navTh').classList.add('active');document.getElementById('thTab').classList.remove('hidden');}
  else if(t==='cmp'){document.getElementById('navCmp').classList.add('active');document.getElementById('cmpTab').classList.remove('hidden');}
  else if(t==='ex'){document.getElementById('navEx').classList.add('active');document.getElementById('exTab').classList.remove('hidden');renderEx();}
  else if(t==='gl'){document.getElementById('navGl').classList.add('active');document.getElementById('glTab').classList.remove('hidden');}
}

function switchTh(i){
  S.thSec=i;
  document.querySelectorAll('.sec-tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  renderTh();
}

// ══ EXERCISES ══════════════════════════════════════════════════
function renderExNums(){
  document.getElementById('exNums').innerHTML=exercises.map((e,i)=>`
    <button class="ex-num ${i===S.exIdx?'active':''} ${S.shown[e.id]?'done':''}"
      onclick="goEx(${i})">${i+1}</button>`).join('');
}
function goEx(i){S.exIdx=i;S.slots=[null,null,null,null];S.matchSel=null;renderExNums();renderEx();}

function renderEx(){
  const ex=exercises[S.exIdx];
  let h=`<span class="ex-tag">ΑΣΚΗΣΗ ${ex.id} | ${ex.pts} Πόντοι</span>`;
  h+=`<p class="question">❓ ${ex.question}</p>`;

  if(ex.type==='mc'){
    h+='<div class="options">';
    ex.opts.forEach((o,i)=>{
      const sel=S.ans[ex.id]===i, show=S.shown[ex.id];
      const cor=i===ex.correct, wr=sel&&!cor;
      h+=`<button class="opt-btn ${sel?'sel':''} ${show&&cor?'correct':''} ${show&&wr?'wrong':''}"
        onclick="selAns(${ex.id},${i})">${['Α','Β','Γ','Δ'][i]}. ${o}</button>`;
    });
    h+='</div>';
    if(!S.shown[ex.id]){
      h+=`<button class="submit-btn" ${S.ans[ex.id]===undefined?'disabled':''} onclick="checkMc(${ex.id})">Υποβολή</button>`;
    } else {
      const ok=S.ans[ex.id]===ex.correct;
      h+=`<div class="result-box ${ok?'correct':'incorrect'}"><p>${ok?`✓ Σωστό! (+${ex.pts} ⭐)`:`✗ Λάθος! Σωστό: ${['Α','Β','Γ','Δ'][ex.correct]}. ${ex.opts[ex.correct]}`}</p></div>`;
    }
  }

  else if(ex.type==='tf'){
    ex.items.forEach((q,i)=>{
      const a=S.ans[ex.id]?S.ans[ex.id][i]:undefined, show=S.shown[ex.id];
      h+=`<div class="tf-item">
        <p class="tf-text">${i+1}. ${q.text}</p>
        <div class="tf-btns">
          <button class="tf-btn ${a===true?'sel':''} ${show&&q.ok?'correct-ans':''}" onclick="selTf(${ex.id},${i},true)">✓ Σωστό</button>
          <button class="tf-btn ${a===false?'sel':''} ${show&&!q.ok?'correct-ans':''}" onclick="selTf(${ex.id},${i},false)">✗ Λάθος</button>
        </div>
      </div>`;
    });
    if(!S.shown[ex.id]){
      const full=S.ans[ex.id]&&S.ans[ex.id].filter(x=>x!==undefined).length===ex.items.length;
      h+=`<button class="submit-btn" ${!full?'disabled':''} onclick="checkTf(${ex.id})">Υποβολή</button>`;
    } else {
      const ok=ex.items.every((q,i)=>S.ans[ex.id][i]===q.ok);
      h+=`<div class="result-box ${ok?'correct':'incorrect'}"><p>${ok?`✓ Όλες σωστές! (+${ex.pts} ⭐)`:'✗ Κάποιες λάθος — δες τις πράσινες!'}</p></div>`;
    }
  }

  else if(ex.type==='fill'){
    let txt=ex.text;
    Object.keys(ex.blanks).forEach(k=>{
      const v=S.fillBlanks[k]||'', show=S.shown[ex.id];
      const ok2=show&&v.trim().toLowerCase()===ex.blanks[k].toLowerCase();
      const er=show&&v&&!ok2;
      txt=txt.replace(`{${k}}`,`<input type="text" class="blank-inp ${ok2?'ok':''} ${er?'err':''}"
        value="${v}" onchange="updFill('${k}',this.value)" ${show?'disabled':''} placeholder="...">`);
    });
    h+=`<div class="fill-area">${txt}</div>`;
    if(!S.shown[ex.id]){
      const all=Object.keys(ex.blanks).every(k=>S.fillBlanks[k]);
      h+=`<button class="submit-btn" ${!all?'disabled':''} onclick="checkFill(${ex.id})">Υποβολή</button>`;
    } else {
      const ok=Object.keys(ex.blanks).every(k=>S.fillBlanks[k]&&S.fillBlanks[k].trim().toLowerCase()===ex.blanks[k].toLowerCase());
      h+=`<div class="result-box ${ok?'correct':'incorrect'}"><p>${ok?`✓ Όλες σωστές! (+${ex.pts} ⭐)`:'✗ Κάποιες λάθος!'}</p></div>`;
      if(!ok){
        h+='<div style="margin-top:10px;padding:14px;background:var(--parchment);border-radius:8px;"><strong>Σωστές:</strong><ul style="margin-left:18px;margin-top:8px;">';
        Object.keys(ex.blanks).forEach(k=>{h+=`<li>${k}: <strong>${ex.blanks[k]}</strong></li>`;});
        h+='</ul></div>';
      }
    }
  }

  else if(ex.type==='matching'){
    const pairs=S.matchPairs[ex.id]||{};
    h+=`<div class="match-wrap">
      <div class="match-col">
        <h4>📋 Στοιχείο</h4>
        ${ex.left.map((item,i)=>`
          <div class="match-item ${S.matchSel===i?'sel-l':''} ${Object.values(pairs).includes(i)?'':''}
            ${S.shown[ex.id]&&pairs[i]!==undefined&&pairs[i]===ex.correctPairs[i]?'matched':''}
            ${S.shown[ex.id]&&pairs[i]!==undefined&&pairs[i]!==ex.correctPairs[i]?'wrong-m':''}"
            onclick="selLeft(${ex.id},${i})">${item}</div>`).join('')}
      </div>
      <div class="match-col">
        <h4>📚 Κείμενο</h4>
        ${ex.right.map((item,ri)=>`
          <div class="match-item ${Object.entries(pairs).some(([k,v])=>v===ri)?'matched':''}"
            onclick="selRight(${ex.id},${ri})">${item}</div>`).join('')}
      </div>
    </div>`;
    const allDone=Object.keys(pairs).length===ex.left.length;
    if(!S.shown[ex.id]){
      h+=`<button class="submit-btn" ${!allDone?'disabled':''} onclick="checkMatch(${ex.id})">Έλεγχος</button>
          <button class="btn btn-prev" style="margin-left:10px;margin-top:10px;" onclick="resetMatch(${ex.id})">↺ Επαναφορά</button>`;
    } else {
      const ok=Object.keys(ex.correctPairs).every(k=>pairs[k]===ex.correctPairs[k]);
      h+=`<div class="result-box ${ok?'correct':'incorrect'}"><p>${ok?`✓ Σωστά! (+${ex.pts} ⭐)`:'✗ Κάποιες λάθος!'}</p></div>`;
    }
  }

  h+=`<div class="btn-group">
    <button class="btn btn-prev" ${S.exIdx===0?'disabled':''} onclick="goEx(${S.exIdx-1})">← Προηγ.</button>
    ${S.exIdx===exercises.length-1
      ?`<button class="btn btn-gold" onclick="startQuiz()">🏆 Τελικό Quiz</button>`
      :`<button class="btn btn-next" onclick="goEx(${S.exIdx+1})">Επόμ. →</button>`}
  </div>`;
  document.getElementById('exContent').innerHTML=h;
}

// ── exercise helpers ──
function selAns(id,i){if(!S.shown[id]){S.ans[id]=i;renderEx();}}
function checkMc(id){const ex=exercises.find(e=>e.id===id);S.shown[id]=true;if(S.ans[id]===ex.correct)addPts(ex.pts);renderExNums();renderEx();}
function selTf(id,i,v){if(!S.shown[id]){if(!S.ans[id])S.ans[id]=[];S.ans[id][i]=v;renderEx();}}
function checkTf(id){const ex=exercises.find(e=>e.id===id);S.shown[id]=true;if(ex.items.every((q,i)=>S.ans[id][i]===q.ok))addPts(ex.pts);renderExNums();renderEx();}
function updFill(k,v){S.fillBlanks[k]=v;}
function checkFill(id){const ex=exercises.find(e=>e.id===id);S.shown[id]=true;if(Object.keys(ex.blanks).every(k=>S.fillBlanks[k]&&S.fillBlanks[k].trim().toLowerCase()===ex.blanks[k].toLowerCase()))addPts(ex.pts);renderExNums();renderEx();}
function selLeft(id,i){if(!S.shown[id]){S.matchSel=i;renderEx();}}
function selRight(id,ri){
  if(S.matchSel===null||S.shown[id])return;
  if(!S.matchPairs[id])S.matchPairs[id]={};
  S.matchPairs[id][S.matchSel]=ri;
  S.matchSel=null;renderEx();
}
function resetMatch(id){S.matchPairs[id]={};S.matchSel=null;delete S.shown[id];renderEx();}
function checkMatch(id){const ex=exercises.find(e=>e.id===id);S.shown[id]=true;const p=S.matchPairs[id]||{};if(Object.keys(ex.correctPairs).every(k=>p[k]===ex.correctPairs[k]))addPts(ex.pts);renderExNums();renderEx();}

// ══ QUIZ ═══════════════════════════════════════════════════════
function startQuiz(){
  S.done.ex=true;updProg();
  document.getElementById('exTab').classList.add('hidden');
  document.getElementById('quizTab').classList.remove('hidden');
  renderQuiz();
}
function renderQuiz(){
  if(S.quizDone){
    const cor=finalQuiz.filter((q,i)=>S.quizAns[i]===q.correct).length;
    const sc=Math.round(cor/finalQuiz.length*100);
    document.getElementById('quizContent').innerHTML=`
      <div class="quiz-card">
        <div style="font-size:64px;margin-bottom:18px;">${sc>=80?'🏆':sc>=60?'⭐':'📚'}</div>
        <h2 style="font-family:'Playfair Display',serif;font-size:24px;color:var(--purple-dark);">Αποτέλεσμα Quiz</h2>
        <div class="quiz-score-box">
          <div class="quiz-score">${sc}/100</div>
          <p>Σωστές: <strong>${cor}/${finalQuiz.length}</strong></p>
          <p>Σύνολο πόντων: <strong>⭐ ${S.pts}</strong></p>
          <p style="margin-top:10px;font-size:18px;">${sc>=80?'🏆 Εξαιρετικό!':sc>=60?'⭐ Καλή δουλειά!':'📚 Μελέτησε ξανά!'}</p>
        </div>
        <button class="continue-btn" onclick="location.reload()">🔄 Νέα Προσπάθεια</button>
      </div>`;
  } else {
    let h=`<div class="quiz-card"><h2 style="font-family:'Playfair Display',serif;font-size:22px;color:var(--purple-dark);margin-bottom:22px;">🏆 Τελικό Quiz</h2>`;
    finalQuiz.forEach((q,qi)=>{
      h+=`<div style="margin-bottom:24px;">
        <p style="font-weight:700;font-size:17px;margin-bottom:11px;color:var(--ink);">${qi+1}. ${q.q}</p>
        <div class="options">
          ${q.opts.map((o,oi)=>`<button class="opt-btn ${S.quizAns[qi]===oi?'sel':''}" onclick="selQz(${qi},${oi})">${['Α','Β','Γ','Δ'][oi]}. ${o}</button>`).join('')}
        </div></div>`;
    });
    const ready=finalQuiz.every((q,i)=>S.quizAns[i]!==undefined);
    h+=`<button class="submit-btn" ${!ready?'disabled':''} onclick="submitQz()">Ολοκλήρωση</button></div>`;
    document.getElementById('quizContent').innerHTML=h;
  }
}
function selQz(qi,oi){S.quizAns[qi]=oi;renderQuiz();}
function submitQz(){const cor=finalQuiz.filter((q,i)=>S.quizAns[i]===q.correct).length;addPts(Math.round(cor/finalQuiz.length*100));S.quizDone=true;renderQuiz();}

// ══ UTILS ══════════════════════════════════════════════════════
function addPts(n){S.pts+=n;updPts();}
function updPts(){document.getElementById('pts').textContent=S.pts;}
function updProg(){let p=0;if(S.done.th)p+=33;if(S.done.cmp)p+=33;if(S.done.ex)p+=34;document.getElementById('progFill').style.width=p+'%';}

init();
</script></script>
