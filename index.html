<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Παράγραφος</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a2e; --ink2:#3d3d5c; --muted:#6b6b8a; --border:#e2e2f0;
  --bg:#f7f7fc; --white:#fff;
  --indigo:#4f46e5; --indigo-l:#eef2ff; --indigo-d:#3730a3;
  --green:#059669; --green-l:#d1fae5;
  --red:#dc2626; --red-l:#fee2e2;
  --amber:#d97706; --amber-l:#fef3c7;
  --teal:#0891b2; --teal-l:#e0f2fe;
  --r:12px; --sh:0 2px 16px rgba(79,70,229,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:20px 16px 48px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto}

/* header */
.app-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:var(--white);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;border-left:4px solid var(--indigo)}
.app-hdr h1{font-family:'IBM Plex Serif',serif;font-size:1.2rem;font-weight:600}
.app-hdr p{font-size:.78rem;color:var(--muted);margin-top:2px}
.badge{background:var(--indigo-l);color:var(--indigo);padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.btn-home{background:none;border:2px solid var(--border);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:1rem;line-height:1;color:var(--ink2);transition:all .15s;display:none}
.btn-mute{background:none;border:2px solid var(--border);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .15s;flex-shrink:0}
.btn-mute:hover{border-color:var(--indigo);color:var(--indigo)}
.btn-home.visible{display:inline-flex;align-items:center;gap:5px}
.btn-home:hover{border-color:var(--indigo);color:var(--indigo)}
.app-hdr-right{display:flex;align-items:center;gap:8px}

/* card */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:14px}

/* loading */
.loading{text-align:center;padding:60px 20px}
.spin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--indigo);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* HOME */
.home-title{font-family:'IBM Plex Serif',serif;font-size:1.6rem;font-weight:600;margin-bottom:6px}
.home-sub{color:var(--muted);font-size:.9rem;margin-bottom:28px}
.home-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:8px}
.home-card{border-radius:var(--r);padding:24px 20px;cursor:pointer;border:2px solid transparent;transition:all .2s;text-align:left;font-family:inherit;background:var(--white);box-shadow:var(--sh)}
.home-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(79,70,229,.13)}
.home-card .hc-icon-wrap{border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:1.3rem}
.home-card .hc-title{font-family:'IBM Plex Serif',serif;font-size:1.05rem;font-weight:600;margin-bottom:6px;color:var(--ink)}
.home-card .hc-desc{font-size:.82rem;color:var(--muted);line-height:1.5}
.home-card .hc-arrow{display:inline-block;margin-top:14px;font-size:.8rem;font-weight:600}
.home-card.c1{border-color:var(--green);background:linear-gradient(135deg,#f0fdf4,#fff)}
.home-card.c1 .hc-icon-wrap{background:var(--green-l)}
.home-card.c1 .hc-arrow{color:var(--green)}
.home-card.c2{border-color:var(--teal);background:linear-gradient(135deg,#f0f9ff,#fff)}
.home-card.c2 .hc-icon-wrap{background:var(--teal-l)}
.home-card.c2 .hc-arrow{color:var(--teal)}
.home-card.c3{border-color:var(--indigo);background:linear-gradient(135deg,var(--indigo-l),#fff)}
.home-card.c3 .hc-icon-wrap{background:var(--indigo-l)}
.home-card.c3 .hc-arrow{color:var(--indigo)}
.home-card.c4{border-color:var(--amber);background:linear-gradient(135deg,var(--amber-l),#fff)}
.home-card.c4 .hc-icon-wrap{background:var(--amber-l)}
.home-card.c4 .hc-arrow{color:var(--amber)}
.home-card.c5{border-color:#e11d48;background:linear-gradient(135deg,#fff1f2,#fff)}
.home-card.c5 .hc-icon-wrap{background:#ffe4e6}
.home-card.c5 .hc-arrow{color:#e11d48}

/* ══ ADAPTIVE LEARNING SCREEN ══ */
.adp-header{background:linear-gradient(135deg,var(--indigo),var(--indigo-d));color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.adp-header h2{font-family:'IBM Plex Serif',serif;font-size:1.2rem;font-weight:600;margin-bottom:4px}
.adp-header p{font-size:.82rem;opacity:.85}

/* Category map */
.cat-map{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.cat-node{display:flex;flex-direction:column;align-items:center;gap:4px}
.cat-dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;background:var(--white);color:var(--muted);transition:all .3s;position:relative}
.cat-dot.active{border-color:var(--indigo);background:var(--indigo);color:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.2)}
.cat-dot.done{border-color:var(--green);background:var(--green-l);color:#065f46}
.cat-dot.failed{border-color:var(--amber);background:var(--amber-l);color:#78350f}
.cat-dot.locked{background:#f1f1f8;color:#aaa}
.cat-dot-lbl{font-size:.68rem;color:var(--muted);font-weight:600}
.cat-arrow{color:var(--border);font-size:1.1rem;line-height:38px;margin-top:0}

/* phase badge */
.ph{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.ph.main{background:var(--indigo-l);color:var(--indigo)}
.ph.retry{background:var(--amber-l);color:var(--amber)}
.ph.fb{background:var(--red-l);color:var(--red)}
.ph.diag{background:var(--teal-l);color:var(--teal)}
.ph.done{background:var(--green-l);color:var(--green)}

/* progress dots */
.prog-dots{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.prog-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:var(--white);transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:.6rem}
.prog-dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.prog-dot.ko{background:var(--red);border-color:var(--red);color:#fff}
.prog-dot.cur{border-color:var(--indigo);background:var(--indigo-l)}

/* progress bar */
.prog-wrap{margin-bottom:16px}
.prog-bar{background:var(--border);border-radius:999px;height:5px;overflow:hidden}
.prog-fill{background:var(--indigo);height:100%;transition:width .4s ease}
.prog-fill.green{background:var(--green)}
.prog-fill.amber{background:var(--amber)}

/* excerpt */
.exc-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--indigo);margin-bottom:8px}
.exc{font-family:'IBM Plex Serif',serif;background:linear-gradient(135deg,#f8f8ff,#f0f0fa);border-left:3px solid var(--indigo);border-radius:0 8px 8px 0;padding:15px 18px;line-height:1.9;font-size:1rem;color:var(--ink);text-align:justify;margin-bottom:0}
.exc.clk{cursor:default}
.tok{cursor:pointer;padding:1px 3px;border-radius:3px;transition:background .12s}
.tok:hover{background:var(--indigo-l)}
.tok.sel{background:var(--indigo);color:#fff}
.tok.hit{background:var(--green);color:#fff}
.tok.miss{background:var(--red);color:#fff}

/* question */
.q-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.q-txt{font-size:.98rem;font-weight:600;color:var(--ink);margin-bottom:14px;line-height:1.5}

/* answers card */
.answers-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:14px;border-top:3px solid var(--border);transition:border-color .3s}
.answers-card.answered-ok{border-top-color:var(--green);background:linear-gradient(to bottom,#f0fdf4,var(--white))}
.answers-card.answered-ko{border-top-color:var(--red);background:linear-gradient(to bottom,#fef2f2,var(--white))}

/* MC/YN */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{padding:11px 15px;border:2px solid var(--border);border-radius:10px;background:var(--white);text-align:left;cursor:pointer;font-size:.9rem;font-family:inherit;color:var(--ink);transition:all .2s;display:flex;align-items:center;gap:10px;position:relative}
.opt:hover:not(:disabled){border-color:#94a3b8;transform:translateX(2px)}
.opt.sel{border-color:var(--indigo);background:var(--indigo-l)}
.opt.ok{border-color:var(--green);background:var(--green);color:#fff;font-weight:600;transform:none}
.opt.ko{border-color:var(--red);background:var(--red);color:#fff;font-weight:600;transform:none}
.opt.neutral-ok{border-color:var(--green);background:var(--green-l);color:#065f46;font-weight:600}
.opt:disabled{cursor:default}
.opt-k{min-width:22px;height:22px;border-radius:50%;background:var(--border);color:var(--ink2);font-size:.72rem;font-weight:700;text-align:center;line-height:22px;flex-shrink:0}
.opt.ok .opt-k,.opt.ko .opt-k{background:rgba(255,255,255,.3);color:#fff}
.opt.neutral-ok .opt-k{background:rgba(5,150,105,.2);color:#065f46}
.opt-badge{position:absolute;top:6px;right:8px;font-size:.8rem;font-weight:700;line-height:1}

/* GAP */
.exc-gap{font-family:'IBM Plex Serif',serif;background:linear-gradient(135deg,#f8f8ff,#f0f0fa);border-left:3px solid var(--indigo);border-radius:0 8px 8px 0;padding:15px 18px;line-height:2.2;font-size:1rem;color:var(--ink);text-align:justify;margin-bottom:14px}
.gap-inp{display:inline-block;border:none;border-bottom:2px solid var(--indigo);background:transparent;font-family:'IBM Plex Serif',serif;font-size:1rem;color:var(--indigo);outline:none;min-width:120px;padding:0 4px;text-align:center}
.gap-inp:disabled{color:var(--green);border-color:var(--green)}
.gap-inp.ko{color:var(--red);border-color:var(--red)}

/* DD */
.dd-wrap{width:100%}
.dd-hint{font-size:.78rem;color:var(--muted);font-style:italic;margin-bottom:12px}
.dd-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;min-height:44px;padding:10px;background:#f8f8ff;border-radius:10px;border:2px dashed var(--border)}
.dd-chip{padding:8px 16px;border:2px solid var(--indigo);border-radius:999px;font-size:.875rem;background:var(--white);cursor:grab;font-family:inherit;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:all .15s;white-space:nowrap}
.dd-chip:hover{background:var(--indigo-l)}
.dd-chip.dragging{opacity:.4;cursor:grabbing}
.dd-chip.used{opacity:.35;cursor:default;border-style:dashed}
.dd-slots{display:flex;flex-direction:column;gap:8px}
.dd-slot-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.dd-slot-lbl{font-size:.875rem;font-weight:600;color:var(--ink2);white-space:nowrap;min-width:100px}
.dd-slot{padding:10px 14px;border:2px dashed var(--border);border-radius:9px;font-size:.875rem;background:#fafafa;min-height:44px;display:flex;align-items:center;color:var(--muted);font-style:italic;transition:all .15s;user-select:none;-webkit-user-select:none;width:100%;box-sizing:border-box}
.dd-slot.over{border-color:var(--indigo);background:var(--indigo-l);border-style:solid}
.dd-slot.filled{border-color:var(--indigo);border-style:solid;background:var(--indigo-l);color:var(--ink);font-style:normal;font-weight:600;cursor:pointer}
.dd-slot.filled:hover{background:#dde4ff}
.dd-slot.ok{border-color:var(--green);border-style:solid;background:var(--green-l);color:#065f46;font-style:normal;font-weight:600}
.dd-slot.ko{border-color:var(--red);border-style:solid;background:var(--red-l);color:#7f1d1d;font-style:normal}
.dd-correct-show{margin-top:12px;padding:12px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0}
.dd-correct-show p{font-size:.78rem;color:#065f46;font-weight:600;margin-bottom:8px}
.dd-correct-row{display:grid;grid-template-columns:1fr 20px 1fr;gap:4px;align-items:center;margin-bottom:4px;font-size:.83rem}
.dd-correct-row .dl{padding:6px 10px;background:var(--green-l);border-radius:6px;color:#065f46}
.dd-correct-row .dr{padding:6px 10px;background:var(--green-l);border-radius:6px;color:#065f46}
.dd-correct-row .da{text-align:center;color:var(--muted)}
@media(max-width:480px){.dd-slot-row{grid-template-columns:1fr}.dd-slot-lbl{font-size:.8rem}}

/* feedback */
.fb-box{border-radius:var(--r);padding:14px 16px;margin-top:14px;font-size:.875rem;line-height:1.65}
.fb-box.ok{background:var(--green-l);border-left:3px solid var(--green)}
.fb-box.ko{background:var(--red-l);border-left:3px solid var(--red)}
.fb-title{font-weight:700;margin-bottom:5px;font-size:.9rem}
.fb-box.ok .fb-title{color:#065f46}
.fb-box.ko .fb-title{color:#7f1d1d}
.fb-box p{color:var(--ink2)}

/* theory box */
.theory-box{background:var(--amber-l);border:1px solid #fcd34d;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:.855rem}
.theory-box h4{color:#92400e;margin-bottom:8px;font-size:.875rem}
.theory-box ul{margin-left:16px;color:#78350f}
.theory-box li{margin-bottom:3px}
.theory-toggle{background:none;border:none;color:var(--indigo);cursor:pointer;font-size:.83rem;font-weight:500;padding:4px 0;margin-bottom:6px;font-family:inherit}

/* theory needed */
.theory-needed{background:var(--red-l);border:1px solid #fca5a5;border-radius:var(--r);padding:18px 20px;margin-top:14px}
.theory-needed h4{color:#7f1d1d;margin-bottom:10px;font-size:1rem;font-weight:700}
.theory-needed p{color:#991b1b;font-size:.875rem;margin-bottom:14px}
.theory-needed ul{margin:0 0 14px 16px;color:#991b1b}
.theory-needed li{font-size:.835rem;margin-bottom:3px}
.tn-choices{display:flex;gap:10px;flex-wrap:wrap}
.tn-btn{flex:1;min-width:140px;padding:12px;border:none;border-radius:var(--r);font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.tn-btn.retry{background:var(--amber);color:#fff}
.tn-btn.retry:hover{background:#b45309}
.tn-btn.skip{background:var(--indigo);color:#fff}
.tn-btn.skip:hover{background:var(--indigo-d)}

/* cat complete */
.cat-complete{background:var(--green-l);border:2px solid var(--green);border-radius:var(--r);padding:18px 22px;margin-bottom:14px;text-align:center}
.cat-complete h3{color:#065f46;font-family:'IBM Plex Serif',serif;font-size:1.1rem;margin-bottom:6px}
.cat-complete p{color:#047857;font-size:.875rem}

/* buttons */
.btn-check{width:100%;padding:13px;border:none;border-radius:var(--r);background:var(--indigo);color:#fff;font-size:.98rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;transition:background .15s}
.btn-check:hover{background:var(--indigo-d)}
.btn-check:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-next{width:100%;padding:13px;border:none;border-radius:var(--r);background:var(--green);color:#fff;font-size:.98rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;transition:background .15s}
.btn-next:hover{background:#047857}
.btn-sec{width:100%;padding:11px;border:2px solid var(--border);border-radius:var(--r);background:var(--white);color:var(--ink2);font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;transition:all .15s}
.btn-sec:hover{border-color:#94a3b8}
.btn-go{width:100%;padding:14px;border:none;border-radius:var(--r);background:var(--indigo);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px;transition:background .15s}
.btn-go:hover{background:var(--indigo-d)}
.btn-go:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}

/* final results */
.score-box{background:var(--indigo-l);border-radius:var(--r);padding:18px;text-align:center;margin:14px 0}
.score-big{font-size:2.8rem;font-weight:700;color:var(--indigo);line-height:1}
.score-pct{color:var(--muted);font-size:.95rem;margin-top:3px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.sc{padding:12px;border-radius:10px;text-align:center}
.sc p:first-child{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.sc p:last-child{font-size:1.3rem;font-weight:700}
.sc.g{background:var(--green-l)} .sc.g p{color:#065f46}
.sc.r{background:var(--red-l)} .sc.r p{color:#7f1d1d}
.sc.a{background:var(--amber-l)} .sc.a p{color:#78350f}

/* cat summary row */
.cat-summary-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;margin-bottom:7px;font-size:.875rem}
.cat-summary-row.pass{background:var(--green-l);border:1px solid #bbf7d0}
.cat-summary-row.skip{background:var(--amber-l);border:1px solid #fcd34d}
.cat-summary-row .cs-name{font-weight:600}
.cat-summary-row.pass .cs-name{color:#065f46}
.cat-summary-row.skip .cs-name{color:#78350f}
.cat-summary-row .cs-badge{font-size:.75rem;padding:2px 8px;border-radius:999px;font-weight:700}
.cat-summary-row.pass .cs-badge{background:#bbf7d0;color:#065f46}
.cat-summary-row.skip .cs-badge{background:#fcd34d;color:#78350f}

/* info */
.info{background:var(--indigo-l);border-radius:8px;padding:11px 15px;font-size:.875rem;color:var(--indigo-d);margin:14px 0;font-weight:500}
.info.warn{background:var(--amber-l);color:#78350f}
.info.success{background:var(--green-l);color:#065f46}

@media(max-width:600px){
  .score-grid{grid-template-columns:1fr}
  .home-cards{grid-template-columns:1fr}
  .exc{font-size:1.05rem;line-height:1.95;padding:14px 15px}
  .exc-gap{font-size:1.05rem;line-height:2.3;padding:14px 15px}
  .gap-inp{font-size:1.05rem}
  .tn-choices{flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-hdr">
    <div>
      <h1>Παράγραφος</h1>
      <p>Νεοελληνική Γλώσσα για το Λύκειο</p>
    </div>
    <div class="app-hdr-right">
      <button class="btn-mute" id="btnMute" title="Σίγαση">🔊</button>
      <button class="btn-home" id="btnHdrHome">🏠 Αρχική</button>
      <span class="badge" id="hdrBadge">Quiz</span>
    </div>
  </div>
  <div id="app"><div class="card loading"><div class="spin"></div><p style="color:var(--muted)">Φόρτωση ερωτήσεων…</p></div></div>
</div>
<footer style="text-align:center;margin-top:32px;padding:16px;font-size:.78rem;color:var(--muted)">
  © Α &amp; Σ Μητσέλος, 2026
</footer>

<script>
// ══════════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════════
let audioMuted = false;
function playSound(type) {
  if (audioMuted) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
    } else {
      osc.frequency.setValueAtTime(330, ctx.currentTime);
      osc.frequency.setValueAtTime(220, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.35);
    }
  } catch(e) {}
}

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let allQ = [];
let catsByKey = {}; // key "1.1" → [q,q,q,...]
let catOrder = [];  // sorted keys ["1.1","1.2",...]

// Adaptive Learning State
let adp = {
  catIdx: 0,           // index into catOrder
  // per-round state
  queue: [],           // current question queue
  qIdx: 0,
  answer: null,
  answered: false,
  ddPairs: {}, ddSelected: null, clkSelected: [],
  showTheory: false,
  _autoTimer: null,
  // round tracking
  roundResults: [],    // true/false per question in current round
  // phase: 'main' | 'retry1' | 'retry2' | 'theory_wall'
  phase: 'main',
  retry1WrongIdx: [],  // indices of wrong answers from main round
  retry2WrongIdx: [],  // indices of wrong in retry1
  // global tracking
  catLog: {},          // "1.1" → 'pass' | 'skip'
  totalCorrect: 0,
  totalAnswered: 0,
  usedIds: {},         // catKey → Set of used question IDs
};

let screen = 'loading';

// ══════════════════════════════════════════════
// CSV PARSING
// ══════════════════════════════════════════════
function parseCSVLine(line) {
  const res = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
    else if (c === ',' && !inQ) { res.push(cur.trim()); cur=''; }
    else cur += c;
  }
  res.push(cur.trim()); return res;
}

function parseCatKey(raw) {
  if (!raw) return null;
  // Handle date-like strings "2026-01-01" or datetime objects serialized as strings
  const m = String(raw).match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if (m) return `${parseInt(m[2])}.${parseInt(m[3])}`;
  return String(raw).trim();
}

function parseCSV(csv) {
  const lines = csv.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if (lines.length < 2) return [];
  const hdrs = parseCSVLine(lines[0]).map(h=>h.trim());
  const data = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    hdrs.forEach((h,idx) => {
      let v = (vals[idx]||'').trim();
      obj[h] = (v===''||v.toLowerCase()==='null'||v.toLowerCase()==='false') ? null : v;
    });
    if (!obj['Ενεργό'] || obj['Ενεργό'].toUpperCase()==='FALSE') continue;
    if (!obj['Τύπος'] || !obj['Κατηγορία'] || !obj['Κείμενο Ερώτησης']) continue;
    obj.catKey = parseCatKey(obj['Κατηγορία']);
    obj.diff = parseInt(obj['Δυσκολία']) || 1;
    obj.theoryKeys = obj['Θεωρία'] ? obj['Θεωρία'].split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)) : null;
    obj.id = obj['ID'];
    obj.type = obj['Τύπος'].trim().toUpperCase();
    obj.q = obj['Κείμενο Ερώτησης'];
    obj.excerpt = obj['Απόσπασμα'] || null;
    obj.optA = obj['Επιλογή Α'] || null;
    obj.optB = obj['Επιλογή Β'] || null;
    obj.optC = obj['Επιλογή Γ'] || null;
    obj.optD = obj['Επιλογή Δ'] || null;
    obj.leftItems  = [obj['Αριστερά 1'],obj['Αριστερά 2'],obj['Αριστερά 3'],obj['Αριστερά 4']].filter(Boolean);
    obj.rightItems = [obj['Δεξιά 1'],obj['Δεξιά 2'],obj['Δεξιά 3'],obj['Δεξιά 4']].filter(Boolean);
    obj.targets = obj['Λέξη-Στόχος'] ? obj['Λέξη-Στόχος'].split('|').map(t=>t.trim()).filter(Boolean) : [];
    obj.correct = (obj['Σωστή Απάντηση']||'').trim();
    obj.fb = [obj['Διόρθωση 1'],obj['Διόρθωση 2'],obj['Διόρθωση 3'],obj['Διόρθωση 4']];
    data.push(obj);
  }
  return data;
}

// ══════════════════════════════════════════════
// DATA LOADING
// ══════════════════════════════════════════════
async function loadData() {
  try {
    const r = await fetch(CSV_URL);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const csv = await r.text();
    allQ = parseCSV(csv);
    if (!allQ.length) throw new Error('Δεν βρέθηκαν ερωτήσεις');

    // Build catsByKey
    catsByKey = {};
    allQ.forEach(q => {
      if (!q.catKey) return;
      if (!catsByKey[q.catKey]) catsByKey[q.catKey] = [];
      catsByKey[q.catKey].push(q);
    });
    // Sort categories numerically
    catOrder = Object.keys(catsByKey).sort((a,b) => {
      const [a1,a2] = a.split('.').map(Number);
      const [b1,b2] = b.split('.').map(Number);
      return a1!==b1 ? a1-b1 : a2-b2;
    });

    screen = 'home';
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center;padding:40px">
        <p style="color:var(--red);font-size:1rem;margin-bottom:12px">⚠️ Αδυναμία φόρτωσης</p>
        <p style="color:var(--muted);font-size:.875rem;margin-bottom:20px">${e.message}</p>
        <button onclick="loadData()" style="padding:10px 24px;background:var(--indigo);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem">Επανάληψη</button>
      </div>`;
    return;
  }
  render();
}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getTheoryKeysForCat(catKey) {
  // catKey like "1.1", "2.2" — first number maps to CAT_NAMES
  const n = parseInt(catKey.split('.')[0]);
  return CAT_THEORY[n] ? [n] : [];
}

function getCatDisplayName(catKey) {
  const [maj, min] = catKey.split('.');
  const base = CAT_NAMES[parseInt(maj)] || `Θέμα ${maj}`;
  return `${base} (${catKey})`;
}

function getQuestionsForCat(catKey, n, excludeIds=[]) {
  const pool = (catsByKey[catKey]||[]).filter(q => !excludeIds.includes(q.id));
  return shuffle(pool).slice(0, n);
}

function checkAnswer(q, answer) {
  if (q.type==='MC' || q.type==='YN') {
    return q.correct.trim().toUpperCase() === (answer||'').trim().toUpperCase();
  }
  if (q.type==='GAP') {
    const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const accepted = q.correct.split('|').map(s=>norm(s));
    const ans = norm(answer||'');
    if (!ans) return false;
    return accepted.some(a => a===ans || a.includes(ans) || ans.includes(a));
  }
  if (q.type==='CLK') {
    const targets = q.targets.map(t=>t.trim().toLowerCase());
    const sel = (answer||[]).map(s=>s.trim().toLowerCase());
    return targets.every(t=>sel.includes(t)) && sel.length===targets.length;
  }
  if (q.type==='DD') {
    const correctPairs = parseCorrectDD(q.correct, q.leftItems, q.rightItems);
    if (!correctPairs) return false;
    for(const [li, ri] of Object.entries(answer||{})) {
      if(correctPairs[parseInt(li)] !== parseInt(ri)) return false;
    }
    return Object.keys(answer||{}).length === q.leftItems.length;
  }
  return false;
}

function parseCorrectDD(correctStr, lefts, rights) {
  if (!correctStr) return null;
  const result = {};
  const pairs = correctStr.split('|').map(s=>s.trim()).filter(Boolean);
  for(const p of pairs) {
    const [l,r] = p.split('→').map(s=>s.trim());
    const li = lefts.findIndex(x=>x && x.trim()===l);
    const ri = rights.findIndex(x=>x && x.trim()===r);
    if(li!==-1 && ri!==-1) result[li]=ri;
  }
  if(!Object.keys(result).length) {
    for(const p of pairs) {
      const m = p.match(/Αριστερά\s*(\d+)\s*→\s*Δεξιά\s*(\d+)/);
      if(m) result[parseInt(m[1])-1]=parseInt(m[2])-1;
    }
  }
  return result;
}

function getFeedback(q, answer) {
  if (q.type==='MC') {
    const map = {Α:0,Β:1,Γ:2,Δ:3};
    const idx = map[(answer||'').toUpperCase()] ?? 0;
    return q.fb[idx] || q.fb.find(f=>f) || null;
  }
  return q.fb[0] || null;
}

function canCheck(q) {
  if (adp.answered) return false;
  if (q.type==='MC'||q.type==='YN') return adp.answer!==null;
  if (q.type==='CLK') return adp.clkSelected.length>0;
  if (q.type==='DD') {
    const cp = parseCorrectDD(q.correct, q.leftItems, q.rightItems);
    const needed = cp ? Object.keys(cp).length : q.leftItems.length;
    return Object.keys(adp.ddPairs).length === needed;
  }
  if (q.type==='GAP') return !!(adp.answer && adp.answer.trim());
  return false;
}

// ══════════════════════════════════════════════
// ADAPTIVE LOGIC
// ══════════════════════════════════════════════
function startAdaptive() {
  adp.catIdx = 0;
  adp.catLog = {};
  adp.totalCorrect = 0;
  adp.totalAnswered = 0;
  adp.usedIds = {};
  startCatMain();
}

function startCatMain() {
  const catKey = catOrder[adp.catIdx];
  if (!adp.usedIds[catKey]) adp.usedIds[catKey] = new Set();
  const qs = getQuestionsForCat(catKey, 3, [...adp.usedIds[catKey]]);
  // If no questions at all → skip this category silently
  if (!qs.length) { adp.catLog[catKey]='pass'; advanceToNextCat(); return; }
  qs.forEach(q => adp.usedIds[catKey].add(q.id));
  adp.queue = qs;
  adp.qIdx = 0;
  adp.answer = null; adp.answered = false;
  adp.ddPairs = {}; adp.ddSelected = null; adp.clkSelected = [];
  adp.roundResults = [];
  adp.phase = 'main';
  adp.showTheory = false;
  screen = 'adaptive';
  render();
}

function startCatRetry1(wrongIdxs) {
  const catKey = catOrder[adp.catIdx];
  const extra = getQuestionsForCat(catKey, 2, [...adp.usedIds[catKey]]);
  // No more questions → παράλειψη retry1, κατευθείαν τείχος θεωρίας
  if (!extra.length) { adp.catLog[catKey]='skip'; screen='theory_wall'; render(); return; }
  extra.forEach(q => adp.usedIds[catKey].add(q.id));
  adp.queue = extra;
  adp.qIdx = 0;
  adp.answer = null; adp.answered = false;
  adp.ddPairs = {}; adp.ddSelected = null; adp.clkSelected = [];
  adp.roundResults = [];
  adp.retry1WrongIdx = wrongIdxs;
  adp.phase = 'retry1';
  adp.showTheory = false;
  screen = 'adaptive';
  render();
}

function startCatRetry2(wrongQs) {
  const catKey = catOrder[adp.catIdx];
  const extra = getQuestionsForCat(catKey, 1, [...adp.usedIds[catKey]]);
  extra.forEach(q => adp.usedIds[catKey].add(q.id));
  const queue = shuffle([...wrongQs, ...extra]);
  // No questions to give → παράλειψη retry2, κατευθείαν τείχος θεωρίας
  if (!queue.length) { adp.catLog[catKey]='skip'; screen='theory_wall'; render(); return; }
  adp.queue = queue;
  adp.qIdx = 0;
  adp.answer = null; adp.answered = false;
  adp.ddPairs = {}; adp.ddSelected = null; adp.clkSelected = [];
  adp.roundResults = [];
  adp.phase = 'retry2';
  adp.showTheory = false;
  screen = 'adaptive';
  render();
}

function finishRound() {
  const catKey = catOrder[adp.catIdx];
  const correct = adp.roundResults.filter(Boolean).length;
  const wrong = adp.roundResults.filter(b=>!b).length;

  if (adp.phase === 'main') {
    if (wrong === 0) {
      adp.catLog[catKey] = 'pass';
      advanceToNextCat();
    } else {
      const wrongIdxs = adp.roundResults.map((r,i)=>r?null:i).filter(i=>i!==null);
      startCatRetry1(wrongIdxs);
    }
  } else if (adp.phase === 'retry1') {
    if (wrong === 0) {
      const origMain = getQuestionsFromLog(catKey, adp.retry1WrongIdx);
      startCatRetry2(origMain);
    } else {
      // At least 1 wrong in retry1 → give 1 new + those wrong in retry1
      const wrongQs = adp.roundResults.map((r,i)=>r?null:adp.queue[i]).filter(Boolean);
      startCatRetry2(wrongQs);
    }
  } else if (adp.phase === 'retry2') {
    if (wrong === 0) {
      // All retry2 correct → pass and move on
      adp.catLog[catKey] = 'pass';
      advanceToNextCat();
    } else {
      // Still wrong → theory wall
      adp.catLog[catKey] = 'skip';
      screen = 'theory_wall';
      render();
    }
  }
}

// Helper: get questions from the main round by index (we store main queue in a log)
let mainQueueLog = {}; // catKey → queue from main round
function getQuestionsFromLog(catKey, wrongIdxs) {
  const mq = mainQueueLog[catKey] || [];
  return wrongIdxs.map(i => mq[i]).filter(Boolean);
}

function advanceToNextCat() {
  if (adp.catIdx < catOrder.length - 1) {
    adp.catIdx++;
    screen = 'cat_transition';
    render();
  } else {
    screen = 'adp_results';
    render();
  }
}

}

// ══════════════════════════════════════════════
// CAT MAP (progress visualization)
// ══════════════════════════════════════════════
function renderCatMap() {
  let html = '<div class="cat-map" style="align-items:center">';
  catOrder.forEach((key, i) => {
    const status = adp.catLog[key];
    const isActive = i === adp.catIdx;
    let cls = 'cat-dot locked';
    let icon = key;
    if (status === 'pass') { cls='cat-dot done'; icon='✓'; }
    else if (status === 'skip') { cls='cat-dot failed'; icon='!'; }
    else if (isActive) { cls='cat-dot active'; icon=key; }
    else if (i < adp.catIdx) { cls='cat-dot done'; icon='✓'; }
    html += `<div class="cat-node">
      <div class="${cls}">${icon}</div>
      <span class="cat-dot-lbl">${key}</span>
    </div>`;
    if (i < catOrder.length-1) html += `<div class="cat-arrow" style="margin-bottom:14px">›</div>`;
  });
  html += '</div>';
  return html;
}

// ══════════════════════════════════════════════
// ADAPTIVE QUIZ SCREEN
// ══════════════════════════════════════════════
function renderAdaptive() {
  const catKey = catOrder[adp.catIdx];
  const q = adp.queue[adp.qIdx];
  if (!q) return '<div class="card"><p>Σφάλμα: δεν βρέθηκε ερώτηση.</p></div>';

  const totalInRound = adp.queue.length;
  const isOk = adp.answered ? checkAnswer(q, adp.answer) : false;

  // Phase label
  let phaseLabel, phaseClass;
  if (adp.phase === 'main') { phaseLabel=`Κατηγορία ${catKey}`; phaseClass='main'; }
  else if (adp.phase === 'retry1') { phaseLabel=`Ανατροφοδότηση ${catKey}`; phaseClass='retry'; }
  else { phaseLabel=`Επανέλεγχος ${catKey}`; phaseClass='fb'; }

  // Progress dots
  let dots = '';
  for (let i=0; i<totalInRound; i++) {
    let cls = 'prog-dot';
    if (i < adp.roundResults.length) cls += adp.roundResults[i] ? ' ok' : ' ko';
    else if (i === adp.qIdx) cls += ' cur';
    const icon = i < adp.roundResults.length ? (adp.roundResults[i]?'✓':'✕') : (i===adp.qIdx?'●':'');
    dots += `<div class="${cls}">${icon}</div>`;
  }

  // Theory toggle
  let theoryHtml = '';
  if (adp.phase !== 'main') {
    theoryHtml = `<button class="theory-toggle" id="btnTheory">${adp.showTheory?'▼':'▶'} Βοήθεια: Θεωρητικό Πλαίσιο</button>`;
    if (adp.showTheory) {
      const keys = getTheoryKeysForCat(catKey);
      if (keys.length) {
        theoryHtml += '<div class="theory-box"><h4>📚 Θεωρητικό Πλαίσιο</h4><ul>';
        keys.forEach(k => {
          if (CAT_THEORY[k]) CAT_THEORY[k].forEach(t => { theoryHtml += `<li>${t}</li>`; });
        });
        theoryHtml += '</ul></div>';
      }
    }
  }

  let html = `
  <div class="adp-header">
    <h2>Βήμα-Βήμα</h2>
    <p>${getCatDisplayName(catKey)}</p>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="ph ${phaseClass}">${phaseLabel}</span>
      <span style="color:var(--muted);font-size:.83rem">${adp.qIdx+1} / ${totalInRound}</span>
    </div>
    <div class="prog-dots">${dots}</div>
    ${renderCatMap()}
  </div>

  ${theoryHtml}

  <div class="card">
    ${q.excerpt ? `<p class="exc-lbl">Απόσπασμα κειμένου</p>${renderExcerpt(q)}` : ''}
    <p class="q-lbl" style="margin-top:${q.excerpt?'14px':'0'}">${qTypeLabel(q.type)}</p>
    <p class="q-txt">${q.q}</p>
    ${q.type==='CLK' ? '<p style="font-size:.8rem;color:var(--muted);font-style:italic;margin-top:4px">Κάντε κλικ στις λέξεις/φράσεις στο απόσπασμα παραπάνω.</p>' : ''}
  </div>`;

  // Answers card
  let cardClass = 'answers-card';
  if (adp.answered) cardClass += isOk ? ' answered-ok' : ' answered-ko';
  html += `<div class="${cardClass}" id="answersCard">`;
  if (q.type==='MC'||q.type==='YN') html += renderMC(q);
  else if (q.type==='DD') html += renderDD(q);
  else if (q.type==='GAP') html += renderGAPInput(q);

  if (adp.answered) {
    html += `<div class="fb-box ${isOk?'ok':'ko'}">
      <p class="fb-title">${isOk?'✅ Σωστά!':'❌ Λάθος'}</p>
      ${!isOk ? `<p>${getFeedback(q, adp.answer)||''}</p>` : ''}
    </div>`;
    const isLast = adp.qIdx === adp.queue.length-1;
    const delay = checkAnswer(adp.queue[adp.qIdx], adp.answer) ? 2 : 4;
    html += `<button class="btn-next" id="btnNext" style="opacity:.7;font-size:.85rem;padding:10px">
      ${isLast ? 'Αξιολόγηση τώρα →' : 'Επόμενη τώρα →'}
      <span style="font-size:.75rem;opacity:.7;margin-left:6px">(αυτόματα σε ${delay}″)</span>
    </button>`;
  } else {
    html += `<button class="btn-check" id="btnCheck" ${canCheck(q)?'':'disabled'}>Έλεγξε</button>`;
  }
  html += '</div>';
  return html;
}

// ══════════════════════════════════════════════
// CAT TRANSITION
// ══════════════════════════════════════════════
function renderCatTransition() {
  const prevKey = catOrder[adp.catIdx-1];
  const nextKey = catOrder[adp.catIdx];
  return `
  <div class="card" style="text-align:center;padding:32px 22px">
    <div style="font-size:2.5rem;margin-bottom:12px">✅</div>
    <h2 style="font-family:'IBM Plex Serif',serif;font-size:1.3rem;margin-bottom:8px">Κατηγορία ${prevKey} ολοκληρώθηκε!</h2>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:20px">Μπράβο! Μπορείς να συνεχίσεις στην κατηγορία <strong>${nextKey}</strong>.</p>
    ${renderCatMap()}
    <button class="btn-go" id="btnNextCat" style="margin-top:16px">Συνέχεια στο ${nextKey} →</button>
    <button class="btn-sec" id="btnHomeFromAdp">↩ Αρχική</button>
  </div>`;
}

// ══════════════════════════════════════════════
// THEORY WALL
// ══════════════════════════════════════════════
function renderTheoryWall() {
  const catKey = catOrder[adp.catIdx];
  const theoryKeys = getTheoryKeysForCat(catKey);
  let theoryItems = '';
  theoryKeys.forEach(k => {
    if (CAT_THEORY[k]) {
      theoryItems += `<p style="font-weight:700;margin-bottom:6px;color:#7f1d1d">${CAT_NAMES[k]||''}</p>`;
      theoryItems += '<ul>' + CAT_THEORY[k].map(t=>`<li>${t}</li>`).join('') + '</ul>';
    }
  });

  return `
  <div class="card">
    <div class="theory-needed">
      <h4>📖 Χρειάζεται να ξαναδείς τη θεωρία</h4>
      <p>Φαίνεται ότι χρειάζεσαι επανάληψη στο θέμα: <strong>${getCatDisplayName(catKey)}</strong></p>
      ${theoryItems ? `<div style="margin:10px 0 14px">${theoryItems}</div>` : ''}
      <p style="font-weight:600;margin-bottom:12px;color:#7f1d1d">Θέλεις να επαναλάβεις την προσπάθεια ή να συνεχίσεις στο επόμενο βήμα;</p>
      <div class="tn-choices">
        <button class="tn-btn retry" id="btnRetryAgain">🔄 Επανάληψη της κατηγορίας</button>
        <button class="tn-btn skip" id="btnSkipToNext">${adp.catIdx < catOrder.length-1 ? '⏭ Συνέχεια στο επόμενο βήμα' : '🏁 Ολοκλήρωση'}</button>
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════
// FINAL RESULTS
// ══════════════════════════════════════════════
function renderAdpResults() {
  const passed = Object.values(adp.catLog).filter(v=>v==='pass').length;
  const skipped = Object.values(adp.catLog).filter(v=>v==='skip').length;
  const total = catOrder.length;
  const pct = Math.round((passed/total)*100);
  const emoji = pct>=80?'🎉':pct>=60?'👍':'📚';

  let catRows = catOrder.map(key => {
    const status = adp.catLog[key] || 'incomplete';
    const cls = status==='pass' ? 'pass' : 'skip';
    const badge = status==='pass' ? '✅ Επιτυχία' : status==='skip' ? '⚠️ Χρειάζεται μελέτη' : '—';
    return `<div class="cat-summary-row ${cls}">
      <span class="cs-name">${getCatDisplayName(key)}</span>
      <span class="cs-badge">${badge}</span>
    </div>`;
  }).join('');

  return `
  <div class="card" style="text-align:center;padding:28px 22px">
    <div style="font-size:2.8rem;margin-bottom:10px">${emoji}</div>
    <h2 style="font-family:'IBM Plex Serif',serif;font-size:1.4rem;margin-bottom:16px">Ολοκλήρωσες το Βήμα-Βήμα!</h2>
    <div class="score-box">
      <p class="score-big">${passed} / ${total}</p>
      <p class="score-pct">κατηγορίες με επιτυχία (${pct}%)</p>
    </div>
    <div class="score-grid" style="margin:14px 0">
      <div class="sc g"><p>Επιτυχία</p><p>${passed}</p></div>
      <div class="sc r"><p>Χρειάζεται μελέτη</p><p>${skipped}</p></div>
      <div class="sc a"><p>Σύνολο</p><p>${total}</p></div>
    </div>
  </div>
  <div class="card">
    <p style="font-weight:700;margin-bottom:12px">Ανά κατηγορία:</p>
    ${catRows}
  </div>
  <button class="btn-sec" id="btnNewAdp" style="margin-top:4px">🔄 Νέα προσπάθεια από την αρχή</button>
  <button class="btn-sec" id="btnHomeFromRes">↩ Αρχική</button>`;
}

// ══════════════════════════════════════════════
// QUESTION RENDERERS
// ══════════════════════════════════════════════
function qTypeLabel(type) {
  return type==='CLK'?'Εντοπισμός':type==='DD'?'Αντιστοίχιση':type==='GAP'?'Συμπλήρωση κενού':type==='YN'?'Ναι / Όχι':'Πολλαπλή επιλογή';
}

function renderExcerpt(q) {
  if (q.type==='CLK') return renderExcerptCLK(q);
  if (q.type==='GAP') return renderExcerptGAP(q);
  return `<div class="exc">${q.excerpt}</div>`;
}

function renderMC(q) {
  const keys = ['Α','Β','Γ','Δ'];
  const vals = [q.optA,q.optB,q.optC,q.optD].filter(Boolean);
  let html = '<div class="opts">';
  vals.forEach((v,i) => {
    const k = keys[i];
    let cls = 'opt'; let badge = '';
    if (adp.answered) {
      const isCorrect = k===q.correct.trim().toUpperCase();
      const isSelected = k===adp.answer;
      const answeredCorrectly = adp.answer===q.correct.trim().toUpperCase();
      if (isSelected && isCorrect) { cls+=' ok'; badge='<span class="opt-badge">✓</span>'; }
      else if (isSelected && !isCorrect) { cls+=' ko'; badge='<span class="opt-badge">✕</span>'; }
      else if (isCorrect && !answeredCorrectly) cls+=' neutral-ok';
    } else {
      if (adp.answer===k) cls+=' sel';
    }
    html += `<button class="${cls}" data-opt="${k}" ${adp.answered?'disabled':''}>
      <span class="opt-k">${k}</span>${v}${badge}
    </button>`;
  });
  html += '</div>';
  return html;
}

function renderGAPInput(q) {
  if (q.excerpt) return '';
  return `<input class="gap-inp" id="gapInp" type="text" placeholder="Συμπλήρωσε…" style="width:100%;margin-top:4px" autocomplete="off" ${adp.answered?'disabled':''}>`;
}

function renderExcerptCLK(q) {
  const targets = q.targets.map(t=>t.trim().toLowerCase());
  const text = q.excerpt;
  const tokens = text.split(/(\s+)/);
  const words = tokens.map(t => /^\s+$/.test(t) ? null : t.replace(/[.,;:!?«»"'()\[\]]/g,'').toLowerCase());
  const wordPhraseMap = {};
  targets.forEach(target => {
    const parts = target.split(' ').filter(Boolean);
    if (parts.length <= 1) return;
    const wordOnlyIdxs = tokens.reduce((acc,t,i)=>{ if(!/^\s+$/.test(t)) acc.push(i); return acc; },[]);
    for (let wi=0; wi<=wordOnlyIdxs.length-parts.length; wi++) {
      const match = parts.every((p,pi)=>words[wordOnlyIdxs[wi+pi]]===p);
      if (match) { for(let pi=0;pi<parts.length;pi++) wordPhraseMap[wordOnlyIdxs[wi+pi]]=target; }
    }
  });
  let html = '<div class="exc clk" id="excClk">';
  tokens.forEach((tok,ti) => {
    if (/^\s+$/.test(tok)) { html+=tok; return; }
    const clean = words[ti];
    const phraseTarget = wordPhraseMap[ti];
    const isSingleTarget = targets.includes(clean);
    const isAnyTarget = phraseTarget || isSingleTarget;
    const isSelPhrase = phraseTarget && adp.clkSelected.includes(phraseTarget);
    const isSelWord = !phraseTarget && adp.clkSelected.some(s=>s.toLowerCase()===clean);
    const isSelected = isSelPhrase || isSelWord;
    let cls = 'tok';
    if (adp.answered) {
      if (isAnyTarget) cls+=' hit';
      else if (!isAnyTarget && isSelected) cls+=' miss';
    } else {
      if (isSelected) cls+=' sel';
    }
    if (isAnyTarget || isSelected) {
      const dataAttr = phraseTarget
        ? `data-phrase="${phraseTarget.replace(/"/g,'&quot;')}" data-word="${tok.replace(/"/g,'&quot;')}"`
        : `data-word="${tok.replace(/"/g,'&quot;')}"`;
      html += `<span class="${cls}" ${dataAttr}>${tok}</span>`;
    } else {
      html += `<span>${tok}</span>`;
    }
  });
  html += '</div>';
  return html;
}

function renderExcerptGAP(q) {
  if (!q.excerpt) return '';
  // Try standard gap markers
  const markers = ['__________','_____','___'];
  for (const m of markers) {
    if (q.excerpt.includes(m)) {
      const parts = q.excerpt.split(m);
      return `<div class="exc-gap">${parts[0]}<input class="gap-inp" id="gapInp" type="text" placeholder="…" autocomplete="off" ${adp.answered?'disabled':''}>${parts.slice(1).join(m)}</div>`;
    }
  }
  // No marker: try to blank out the first accepted answer word in the text
  const firstCorrect = q.correct.split('|')[0].trim();
  if (firstCorrect && q.excerpt.includes(firstCorrect)) {
    const idx = q.excerpt.indexOf(firstCorrect);
    const before = q.excerpt.slice(0, idx);
    const after = q.excerpt.slice(idx + firstCorrect.length);
    return `<div class="exc-gap">${before}<input class="gap-inp" id="gapInp" type="text" placeholder="…" autocomplete="off" ${adp.answered?'disabled':''}>${after}</div>`;
  }
  // Fallback: show full excerpt, input appears below via renderGAPInput
  return `<div class="exc" style="margin-bottom:14px">${q.excerpt}</div>`;
}

function renderDD(q) {
  const correctPairs = parseCorrectDD(q.correct, q.leftItems, q.rightItems) || {};
  // Only show left chips that participate in correct pairs
  const activeLeftIdxs = Object.keys(correctPairs).map(Number);
  // Only show right slots that are targets in correct pairs
  const activeRightIdxs = Object.values(correctPairs).map(Number);
  if (!q._shuffledRight) {
    q._shuffledRight = shuffle(q.rightItems.map((r,i)=>({r,i})).filter(({i})=>activeRightIdxs.includes(i)));
  }
  const shuffledRight = q._shuffledRight;
  let html = '<div class="dd-wrap">';
  if (adp.answered) {
    html += '<div class="dd-slots">';
    shuffledRight.forEach(({r,i}) => {
      const usedByLeft = Object.entries(adp.ddPairs).find(([,ri])=>ri===i);
      const li = usedByLeft ? parseInt(usedByLeft[0]) : null;
      const filledText = li !== null ? q.leftItems[li] : '—';
      const correctRi = li !== null ? correctPairs[li] : null;
      const isOk = correctRi === i;
      html += `<div class="dd-slot-row"><span class="dd-slot-lbl">${r}</span><div class="dd-slot ${isOk?'ok':'ko'}">${filledText}</div></div>`;
    });
    html += '</div>';
    const allOk = activeLeftIdxs.every(li=>adp.ddPairs[li]===correctPairs[li]);
    if (!allOk) {
      html += '<div class="dd-correct-show"><p>✅ Σωστές αντιστοιχίσεις:</p>';
      activeLeftIdxs.forEach(li=>{
        const ri = correctPairs[li];
        html += `<div class="dd-correct-row"><div class="dl">${q.leftItems[li]}</div><div class="da">→</div><div class="dr">${q.rightItems[ri]||'—'}</div></div>`;
      });
      html += '</div>';
    }
  } else {
    html += '<p class="dd-hint">🖱️ Σύρε chip στη σωστή θέση · Κινητό: πάτα chip → πάτα θέση</p>';
    html += '<div class="dd-chips">';
    activeLeftIdxs.forEach(li=>{
      const used = adp.ddPairs[li] !== undefined;
      html += `<div class="dd-chip ${used?'used':''}" draggable="${!used}" data-dd-li="${li}">${q.leftItems[li]}</div>`;
    });
    html += '</div><div class="dd-slots">';
    shuffledRight.forEach(({r,i})=>{
      const usedByLeft = Object.entries(adp.ddPairs).find(([,ri])=>ri===i);
      const isFilled = usedByLeft !== undefined;
      const filledLi = isFilled ? parseInt(usedByLeft[0]) : null;
      const filledText = isFilled ? q.leftItems[filledLi] : '↓ τοποθέτησε εδώ';
      html += `<div class="dd-slot-row"><span class="dd-slot-lbl">${r}</span><div class="dd-slot ${isFilled?'filled':''}" data-dd-ri="${i}">${filledText}</div></div>`;
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ══════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════
function attachEvents() {
  const btnMute = document.getElementById('btnMute');
  if (btnMute) btnMute.addEventListener('click', ()=>{
    audioMuted=!audioMuted; btnMute.textContent=audioMuted?'🔇':'🔊';
  });
  const btnHdrHome = document.getElementById('btnHdrHome');
  if (btnHdrHome) btnHdrHome.addEventListener('click', ()=>{ screen='home'; render(); });

  // Home
  const btnStartAdp = document.getElementById('btnStartAdp');
  if (btnStartAdp) btnStartAdp.addEventListener('click', startAdaptive);

  // Theory toggle
  const btnTh = document.getElementById('btnTheory');
  if (btnTh) btnTh.addEventListener('click', ()=>{ adp.showTheory=!adp.showTheory; render(); });

  // MC/YN options
  document.querySelectorAll('[data-opt]').forEach(b =>
    b.addEventListener('click', ()=>{ if(!adp.answered){ adp.answer=b.dataset.opt; render(); } }));

  // CLK tokens
  document.querySelectorAll('[data-word]').forEach(b =>
    b.addEventListener('click', ()=>{
      if (adp.answered) return;
      if (b.dataset.phrase) {
        const phrase = b.dataset.phrase;
        const idx = adp.clkSelected.indexOf(phrase);
        if (idx!==-1) adp.clkSelected.splice(idx,1); else adp.clkSelected.push(phrase);
      } else {
        const w = b.dataset.word.replace(/[.,;:!?«»"'()\[\]]/g,'').trim();
        const idx = adp.clkSelected.indexOf(w);
        if (idx!==-1) adp.clkSelected.splice(idx,1); else adp.clkSelected.push(w);
      }
      render();
    }));

  // DD drag & drop
  let _ddDrag = null, _ddChip = null;
  document.querySelectorAll('[data-dd-li]').forEach(el => {
    const li = parseInt(el.dataset.ddLi);
    if (el.classList.contains('used')) return;
    el.addEventListener('dragstart', e=>{ _ddDrag=li; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(li)); });
    el.addEventListener('dragend', ()=>el.classList.remove('dragging'));
    el.addEventListener('click', ()=>{
      if (adp.answered) return;
      if (_ddChip===li) { _ddChip=null; document.querySelectorAll('[data-dd-li]').forEach(c=>c.classList.remove('dragging')); }
      else { _ddChip=li; document.querySelectorAll('[data-dd-li]').forEach(c=>c.classList.remove('dragging')); el.classList.add('dragging'); }
    });
  });
  document.querySelectorAll('[data-dd-ri]').forEach(slot => {
    const ri = parseInt(slot.dataset.ddRi);
    slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', ()=>slot.classList.remove('over'));
    slot.addEventListener('drop', e=>{
      e.preventDefault(); slot.classList.remove('over');
      if (_ddDrag===null) return;
      Object.keys(adp.ddPairs).forEach(k=>{ if(adp.ddPairs[k]===ri) delete adp.ddPairs[k]; });
      adp.ddPairs[_ddDrag]=ri; _ddDrag=null; render();
    });
    slot.addEventListener('click', ()=>{
      if (adp.answered) return;
      if (_ddChip!==null) {
        Object.keys(adp.ddPairs).forEach(k=>{ if(adp.ddPairs[k]===ri) delete adp.ddPairs[k]; });
        adp.ddPairs[_ddChip]=ri; _ddChip=null;
        document.querySelectorAll('[data-dd-li]').forEach(c=>c.classList.remove('dragging'));
        render();
      } else {
        const ub = Object.entries(adp.ddPairs).find(([,v])=>v===ri);
        if (ub) { delete adp.ddPairs[parseInt(ub[0])]; render(); }
      }
    });
  });

  // GAP input
  const gapInp = document.getElementById('gapInp');
  if (gapInp) {
    if (adp.answer) gapInp.value = adp.answer;
    gapInp.addEventListener('input', ()=>{ adp.answer=gapInp.value; const btn=document.getElementById('btnCheck'); if(btn) btn.disabled=!adp.answer.trim(); });
    gapInp.addEventListener('keydown', e=>{ if(e.key==='Enter'&&adp.answer) doCheck(); });
  }

  // Check / Next
  const btnCheck = document.getElementById('btnCheck');
  if (btnCheck) btnCheck.addEventListener('click', doCheck);
  const btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.addEventListener('click', doNext);

  // Transitions
  const btnNextCat = document.getElementById('btnNextCat');
  if (btnNextCat) btnNextCat.addEventListener('click', startCatMain);
  const btnHomeFromAdp = document.getElementById('btnHomeFromAdp');
  if (btnHomeFromAdp) btnHomeFromAdp.addEventListener('click', ()=>{ screen='home'; render(); });

  // Theory wall choices
  const btnRetryAgain = document.getElementById('btnRetryAgain');
  if (btnRetryAgain) btnRetryAgain.addEventListener('click', ()=>{
    // Reset usedIds for this cat and start fresh
    const catKey = catOrder[adp.catIdx];
    adp.usedIds[catKey] = new Set();
    adp.catLog[catKey] = undefined;
    delete adp.catLog[catKey];
    mainQueueLog[catKey] = null;
    startCatMain();
  });
  const btnSkipToNext = document.getElementById('btnSkipToNext');
  if (btnSkipToNext) btnSkipToNext.addEventListener('click', ()=>{
    if (adp.catIdx < catOrder.length-1) { adp.catIdx++; screen='cat_transition'; }
    else { screen='adp_results'; }
    render();
  });

  // Results
  const btnNewAdp = document.getElementById('btnNewAdp');
  if (btnNewAdp) btnNewAdp.addEventListener('click', startAdaptive);
  const btnHomeFromRes = document.getElementById('btnHomeFromRes');
  if (btnHomeFromRes) btnHomeFromRes.addEventListener('click', ()=>{ screen='home'; render(); });
}

// ══════════════════════════════════════════════
// CHECK / NEXT ACTIONS
// ══════════════════════════════════════════════
function doCheck() {
  const q = adp.queue[adp.qIdx];
  if (q.type==='GAP') { const inp=document.getElementById('gapInp'); adp.answer=inp?inp.value.trim():adp.answer; }
  if (q.type==='CLK') adp.answer=[...adp.clkSelected];
  if (q.type==='DD') adp.answer={...adp.ddPairs};
  adp.answered = true;
  const ok = checkAnswer(q, adp.answer);
  adp.roundResults.push(ok);
  adp.totalAnswered++;
  if (ok) adp.totalCorrect++;
  render();
  playSound(ok ? 'correct' : 'wrong');
  if (adp._autoTimer) clearTimeout(adp._autoTimer);
  const delay = ok ? 2000 : 4000;
  adp._autoTimer = setTimeout(()=>{ if(adp.answered) doNext(); }, delay);
}

function doNext() {
  if (adp._autoTimer) { clearTimeout(adp._autoTimer); adp._autoTimer=null; }

  // Store main queue for retry reference
  if (adp.phase === 'main') {
    const catKey = catOrder[adp.catIdx];
    if (!mainQueueLog[catKey]) mainQueueLog[catKey] = [...adp.queue];
  }

  if (adp.qIdx < adp.queue.length-1) {
    // More questions in this round
    adp.qIdx++;
    adp.answer=null; adp.answered=false;
    adp.ddPairs={}; adp.ddSelected=null; adp.clkSelected=[];
    render();
  } else {
    // Round finished — evaluate
    finishRound();
  }
}

// ══════════════════════════════════════════════

// ══════════════════════════════════════════════
loadData();
</script>
